<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="射タイムシフトカメラ">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>射タイムシフトカメラ</title>
<script>
  // ---- 診断用: 通常はconsoleにしか出ない未捕捉のエラーを、画面の診断欄にも表示する ----
  // iPad実機でWeb Inspector(Mac接続)が無くても原因特定できるようにするための一時的な
  // 仕組み。アプリ本体のロジックには一切関与しない(表示するだけ)。
  // #diagLineはこの時点ではまだDOMに存在しないため、エラー発生時に都度取得する。
  window.addEventListener("error", (e) => {
    const el = document.getElementById("diagLine");
    const msg =
      "⚠ 未捕捉のJSエラー: " +
      (e.message || (e.error && e.error.message) || "(詳細不明)") +
      " @ " + (e.filename || "?") + ":" + (e.lineno || "?");
    console.error(msg, e.error);
    if (el) el.innerHTML += (el.innerHTML ? "<br>" : "") + '<span class="bad">' + msg + "</span>";
  });
  window.addEventListener("unhandledrejection", (e) => {
    const el = document.getElementById("diagLine");
    const reason = e.reason && e.reason.message ? e.reason.message : String(e.reason);
    const msg = "⚠ 未処理のPromiseエラー: " + reason;
    console.error(msg, e.reason);
    if (el) el.innerHTML += (el.innerHTML ? "<br>" : "") + '<span class="bad">' + msg + "</span>";
  });
</script>
<style>
  :root {
    --bg: #15140f;
    --bg-panel: #1e1c15;
    --line: #34302380;
    --text: #ece6d6;
    --text-dim: #a49d87;
    --accent: #b2402c;
    --accent-dim: #7a2c1f;
    --ok: #5c8a5c;
    --warn: #c9a13b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    overscroll-behavior: none;
    user-select: none;
  }
  #app {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
  }
  header {
    padding: max(12px, env(safe-area-inset-top)) 16px 10px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    border-bottom: 1px solid var(--line);
  }
  header h1 {
    font-size: 16px; font-weight: 600; margin: 0; letter-spacing: 0.02em;
    flex-shrink: 0;
  }
  #headerRight { display: flex; align-items: center; gap: 10px; }
  #status { font-size: 12px; color: var(--text-dim); }
  #status.live { color: var(--ok); }
  #debugToggle {
    font-size: 11px; padding: 4px 9px; border-radius: 6px;
    background: transparent; border: 1px solid var(--line); color: var(--text-dim);
  }
  #debugToggle.on { color: var(--warn); border-color: var(--warn); }

  #stage {
    position: relative; flex: 1; min-height: 0;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  #displayCanvas {
    max-width: 100%; max-height: 100%;
    width: 100%; height: 100%;
    object-fit: contain;
  }
  #stageMessage {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; gap: 14px;
    color: var(--text-dim); font-size: 15px; line-height: 1.8;
  }
  #stageMessage p { margin: 0; max-width: 46em; }
  #diagLine {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px; color: var(--text-dim); opacity: 0.75;
    white-space: pre-wrap; max-width: 46em;
  }
  #diagLine .bad { color: var(--warn); }
  #delayBadge {
    position: absolute; top: 14px; left: 14px;
    background: rgba(21,20,15,0.72);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
    letter-spacing: 0.03em;
    color: var(--text);
    pointer-events: none;
  }
  #delayBadge b { color: var(--accent); font-weight: 700; }

  #debugPanel {
    position: absolute; top: 14px; right: 14px;
    background: rgba(10,10,8,0.82);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 11px;
    line-height: 1.7;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--text-dim);
    pointer-events: none;
    display: none;
    max-width: 62vw;
  }
  #debugPanel .warn { color: var(--warn); }
  #debugPanel .row { display: flex; justify-content: space-between; gap: 12px; }
  #debugPanel .row span:last-child { color: var(--text); }

  footer {
    padding: 8px 12px max(8px, env(safe-area-inset-bottom));
    background: var(--bg-panel);
    border-top: 1px solid var(--line);
  }
  .row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .row + .row { margin-top: 6px; }
  .label { font-size: 10px; color: var(--text-dim); margin-bottom: 4px; letter-spacing: 0.04em; }
  button {
    font-family: inherit;
    border: 1px solid var(--line);
    background: #262319;
    color: var(--text);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  button:active { background: #332e20; }
  button.selected { background: var(--accent-dim); border-color: var(--accent); color: #fff; }
  button.wide { flex: 1; }
  button.grow2 { flex: 2; }
  button.adjust { min-width: 42px; text-align: center; font-weight: 700; }
  button.primary {
    background: var(--accent); border-color: var(--accent); color: #fff;
    font-weight: 700; padding: 10px 14px; font-size: 15px;
  }
  button.primary:active { background: var(--accent-dim); }
  button.secondary-action {
    background: transparent; border: 1px solid var(--ok); color: var(--ok);
    padding: 8px 14px; font-size: 13px; font-weight: 600;
  }
  /* 5秒戻る(使用頻度が高い)を5秒進むより明確に大きく・濃くする */
  button.seek-major { flex: 1.3; font-weight: 600; }
  button.seek-minor { flex: 0.7; font-size: 11px; color: var(--text-dim); }
  button:disabled { opacity: 0.4; }
  #slowIndicator {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #fff;
    font-size: 13px; font-weight: 700; letter-spacing: 0.05em;
    padding: 6px 14px; border-radius: 999px;
    display: none;
    pointer-events: none;
  }
  #privacyNote { font-size: 10px; color: var(--text-dim); text-align: center; margin: 8px 0 0; line-height: 1.5; }

  #settingsToggle {
    font-size: 11px; padding: 4px 9px; border-radius: 6px;
    background: transparent; border: 1px solid var(--line); color: var(--text-dim);
  }
  #settingsToggle.on { color: var(--text); border-color: var(--text-dim); }
  .hint-note { font-size: 10px; color: var(--text-dim); margin: 8px 0 0; line-height: 1.6; }

  /* ---- 設定パネル(遅延時間・カメラ切替等)は既定で折りたたむ ---- */
  #secondaryControls {
    display: none;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--line);
  }
  #secondaryControls.open { display: block; }

  #fullscreenToggle {
    font-size: 11px; padding: 4px 9px; border-radius: 6px;
    background: transparent; border: 1px solid var(--line); color: var(--text-dim);
  }
  #fullscreenToggle.on { color: var(--ok); border-color: var(--ok); }

  #orientationHint {
    position: fixed; inset: 0; z-index: 50;
    background: var(--bg);
    display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    text-align: center; padding: 24px;
  }
  #orientationHint.show { display: flex; }
  #orientationHint .icon { font-size: 46px; transform: rotate(90deg); color: var(--accent); }
  #orientationHint p { margin: 0; color: var(--text); font-size: 16px; line-height: 1.8; }

  /* ---- 全画面時：映像そのものを画面いっぱいに表示し、 ----
     ヘッダー・フッターは非表示になる。
     操作は#stage内にオーバーレイした最小限のコントロールバー(#fsControls)で行う。
     親要素のflexレイアウトの影響を受けないよう、position/sizeを強めに上書きする。
     ネイティブFullscreen API(:fullscreen)と、standalone起動時などのCSSフォールバック
     (#app.pseudo-fullscreen)の両方に同じスタイルを適用する。 */
  #fsControls { display: none; }
  #stage:fullscreen, #stage:-webkit-full-screen, #app.pseudo-fullscreen #stage {
    position: fixed !important;
    inset: 0 !important;
    width: 100vw !important;
    height: 100dvh !important;
    max-width: none !important;
    max-height: none !important;
    margin: 0 !important;
    background: #000;
    z-index: 2147483647;
  }
  #stage:fullscreen #displayCanvas, #stage:-webkit-full-screen #displayCanvas,
  #app.pseudo-fullscreen #stage #displayCanvas {
    width: 100%; height: 100%;
  }
  #stage:fullscreen #fsControls,
  #stage:-webkit-full-screen #fsControls,
  #app.pseudo-fullscreen #fsControls {
    display: flex; flex-direction: column; gap: 8px;
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 12px 16px max(12px, env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(10,10,8,0.85), rgba(10,10,8,0) 100%);
  }
  #fsExit {
    display: none;
    position: absolute; top: 14px; right: 14px;
    background: rgba(21,20,15,0.72); border: 1px solid var(--line);
    font-size: 12px; padding: 6px 12px; border-radius: 8px;
  }
  #stage:fullscreen #fsExit, #stage:-webkit-full-screen #fsExit,
  #app.pseudo-fullscreen #fsExit { display: block; }
  /* pseudo-fullscreen時はheader/footer自体をDOM上も隠す(ネイティブFullscreenは対象外なので自動では隠れない) */
  #app.pseudo-fullscreen header, #app.pseudo-fullscreen footer { display: none; }


  /* ---- スロー確認中のフォーカスモード ---- */
  /* スロー確認中は、頻繁に使わない補助コントロール(遅延設定・カメラ切替等)を隠し、
     映像とスロー操作に必要なボタンだけを残す。 */
  #app.focus-mode #secondaryControls { display: none; }
  #app.focus-mode .act-slow-check { display: none; }

  /* ---- 一定時間操作がない場合、UIを薄くする(タップで再表示) ---- */
  #app.ui-dim header, #app.ui-dim footer, #app.ui-dim #fsControls {
    opacity: 0.18;
    transition: opacity 0.4s ease;
  }
  header, footer, #fsControls { transition: opacity 0.25s ease; }

  /* ---- 保存した射の一覧 ---- */
  #shotList { margin-top: 6px; }
  .shot-item {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 0; border-bottom: 1px solid var(--line);
  }
  .shot-item:last-child { border-bottom: none; }
  .shot-item-info { font-size: 12px; color: var(--text); line-height: 1.5; }
  .shot-item-info span { display: block; color: var(--text-dim); font-size: 10px; }
  .shot-item-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .shot-item-actions button { padding: 6px 10px; font-size: 11px; }
  .shot-delete { color: var(--accent); border-color: var(--accent-dim); }

  /* ---- 保存済み射の再生オーバーレイ ---- */
  #shotReviewOverlay {
    position: fixed; inset: 0; z-index: 999;
    background: #000;
    display: flex; flex-direction: column;
  }
  #shotReviewHeader {
    display: flex; justify-content: space-between; align-items: center;
    padding: max(10px, env(safe-area-inset-top)) 14px 8px;
    background: var(--bg-panel);
    font-size: 13px; color: var(--text);
  }
  #shotReviewClose {
    font-size: 12px; padding: 6px 12px; border-radius: 8px;
    background: transparent; border: 1px solid var(--line); color: var(--text-dim);
  }
  #shotReviewCanvas {
    width: 100%; height: 100%; object-fit: contain; background: #000; display: block;
  }
  #shotReviewStage {
    position: relative; flex: 1; min-height: 0; width: 100%;
    background: #000;
  }
  /* STEP12時点では配置・サイズ同期のみ。マーキングの描画・操作はまだ実装しない。 */
  #shotReviewMarkingOverlay {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    pointer-events: none;
  }
  #shotReviewPosition {
    text-align: center;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px; color: var(--text-dim);
    margin: 0 0 8px;
  }
  #shotReviewControls {
    padding: 10px 14px max(10px, env(safe-area-inset-bottom));
    background: var(--bg-panel);
  }

  /* ---- マーキングOverlay Canvas ---- */
  /* displayCanvasと完全に同じCSSサイズで重ねる。内部ピクセルサイズはJS側で
     displayCanvasと同じ値に揃える(applyOrientation()内)。タップは、マーキングモードが
     有効な間だけ受け取る(通常時は下のdisplayCanvasやstageへの操作を妨げない)。 */
  #markingOverlay {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    pointer-events: none;
  }
  #markingOverlay.active { pointer-events: auto; touch-action: none; }

  #markingToggle {
    font-size: 11px; padding: 4px 9px; border-radius: 6px;
    background: transparent; border: 1px solid var(--line); color: var(--text-dim);
  }
  #markingToggle.on { color: var(--accent); border-color: var(--accent); }

  /* ---- STEP13: レビュー側マーキング(ライブ側とは完全に独立) ---- */
  #shotMarkingToggle {
    font-size: 11px; padding: 4px 9px; border-radius: 6px;
    background: transparent; border: 1px solid var(--line); color: var(--text-dim);
  }
  #shotMarkingToggle.on { color: var(--accent); border-color: var(--accent); }
  #shotReviewMarkingOverlay.active { pointer-events: auto; touch-action: none; }
  #shotMarkingToolbar { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .shot-mark-tool { flex: 1; font-size: 12px; padding: 9px 4px; }

  #markingToolbar { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .mark-tool { flex: 1; font-size: 12px; padding: 9px 4px; }
  .mark-tool.selected { background: var(--accent-dim); border-color: var(--accent); color: #fff; }
  #markClearAll.confirming { background: var(--accent); border-color: var(--accent); color: #fff; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>射タイムシフトカメラ</h1>
    <div id="headerRight">
      <span id="status">起動中…</span>
      <button id="markingToggle">マーキング</button>
      <button id="settingsToggle">設定</button>
      <button id="fullscreenToggle">全画面</button>
      <button id="debugToggle">デバッグ</button>
    </div>
  </header>

  <div id="orientationHint">
    <div class="icon">⟳</div>
    <p>デバイスを横向きにしてご使用ください</p>
  </div>

  <div id="stage">
    <canvas id="displayCanvas"></canvas>
    <canvas id="markingOverlay"></canvas>
    <div id="delayBadge" style="display:none">遅延 <b id="delayValueLabel">10</b> 秒</div>
    <div id="slowIndicator">SLOW 1/3x</div>
    <div id="debugPanel"></div>
    <div id="stageMessage">
      <p id="stageMessageText">カメラへのアクセスを準備しています…</p>
      <div id="diagLine"></div>
    </div>

    <!-- 全画面時のみ表示される最小限のオーバーレイ操作パネル -->
    <button id="fsExit">全画面終了</button>
    <div id="fsControls">
      <div class="row">
        <button class="act-seek-back seek-major">5秒戻る</button>
        <button class="act-slow-check primary grow2">スロー確認</button>
        <button class="act-seek-fwd seek-minor">5秒進む</button>
      </div>
      <div class="row">
        <button class="act-play-pause wide">一時停止</button>
        <button class="act-go-live secondary-action wide">現在へ</button>
      </div>
    </div>
  </div>

  <footer>
    <div id="markingToolbar" style="display:none">
      <div class="row">
        <button class="mark-tool" data-mode="point">●点</button>
        <button class="mark-tool" data-mode="vertical">│縦線</button>
        <button class="mark-tool" data-mode="horizontal">─横線</button>
        <button class="mark-tool" data-mode="angle">∠角度</button>
        <button class="mark-tool" data-mode="arrow_release">🏹矢</button>
        <button class="mark-tool" data-mode="erase">消去</button>
      </div>
      <div class="row">
        <button id="markClearAll" class="wide">全消去</button>
      </div>
    </div>

    <div class="row">
      <button class="act-seek-back seek-major">5秒戻る</button>
      <button class="act-slow-check primary grow2">スロー確認</button>
      <button class="act-seek-fwd seek-minor">5秒進む</button>
    </div>
    <div class="row">
      <button class="act-play-pause wide">一時停止</button>
      <button class="act-go-live secondary-action wide">現在へ</button>
    </div>

    <div id="secondaryControls">
      <div class="label">遅延時間</div>
      <div class="row" id="delayPresets"></div>

      <div class="row">
        <button id="minusOne" class="adjust">−1秒</button>
        <button id="plusOne" class="adjust">＋1秒</button>
        <button id="flipCamera" class="wide">カメラ切替</button>
      </div>
      <div class="row">
        <button id="mirrorToggle" class="wide">左右反転</button>
        <button id="rotateView" class="wide">映像回転</button>
      </div>

      <div class="label" style="margin-top:14px">スロー速度</div>
      <div class="row" id="slowRatePresets"></div>

      <div class="label" style="margin-top:10px">スロー範囲</div>
      <div class="row" id="slowWindowPresets"></div>

      <div class="label" style="margin-top:14px">コマ送り（詳細確認）</div>
      <div class="row">
        <button id="stepBack" class="wide">|◀ 1F</button>
        <button id="stepForward" class="wide">1F ▶|</button>
      </div>

      <div class="label" style="margin-top:14px">射の保存</div>
      <div class="row" id="saveRangePresets"></div>
      <div class="row">
        <button id="saveShotBtn" class="wide primary">この射を保存</button>
      </div>
      <p id="saveStatus" class="hint-note" style="display:none"></p>

      <div class="label" style="margin-top:14px">保存した射</div>
      <div id="shotList" class="hint-note">まだ保存された射はありません。</div>

      <p class="hint-note">「現在へ」は設定した遅延時間を維持したまま、通常の遅延再生位置に戻ります（リアルタイム映像ではありません）。</p>
      <p id="privacyNote">映像は端末内でのみ処理され、外部には送信・保存されません。</p>
    </div>
  </footer>
</div>

<!-- 保存済み射の再生オーバーレイ。Buffer/Playback Engineは新設せず、
     PlaybackEngineの別インスタンス＋BufferEngine.findFrameAtをそのまま使い回す。 -->
<div id="shotReviewOverlay" style="display:none">
  <div id="shotReviewHeader">
    <span id="shotReviewTitle">射の再生</span>
    <button id="shotMarkingToggle">マーキング</button>
    <button id="shotReviewClose">閉じる</button>
  </div>
  <div id="shotReviewStage">
    <canvas id="shotReviewCanvas"></canvas>
    <canvas id="shotReviewMarkingOverlay"></canvas>
  </div>
  <div id="shotReviewControls">
    <div id="shotMarkingToolbar" style="display:none">
      <div class="row">
        <button class="shot-mark-tool" data-tool="draw">描く</button>
        <button class="shot-mark-tool" data-tool="erase">消去</button>
      </div>
      <div class="row">
        <button id="shotMarkClearAll" class="wide">全消去</button>
      </div>
    </div>
    <p id="shotReviewPosition">0.0 / 0.0秒</p>
    <div class="row">
      <button id="shotSeekBack" class="seek-major">5秒戻る</button>
      <button id="shotSlowCheck" class="primary grow2">スロー確認</button>
      <button id="shotSeekForward" class="seek-minor">5秒進む</button>
    </div>
    <div class="row">
      <button id="shotStepBack" class="wide">|◀ 1F</button>
      <button id="shotPlayPause" class="wide primary">一時停止</button>
      <button id="shotStepForward" class="wide">1F ▶|</button>
    </div>
    <div class="label" style="margin-top:12px">速度</div>
    <div class="row" id="shotSlowRatePresets"></div>
    <div class="label" style="margin-top:8px">範囲</div>
    <div class="row" id="shotSlowWindowPresets"></div>
  </div>
</div>

<video id="sourceVideo" autoplay muted playsinline style="display:none"></video>

<script src="bufferEngine.js"></script>
<script src="playbackEngine.js"></script>
<script src="storageEngine.js"></script>
<script src="coordinateEngine.js"></script>
<script>
(() => {
  "use strict";

  // ---- 設定 ----
  const PRESETS = [1, 2, 3, 5, 7, 10, 15, 20, 25, 30];
  const DEFAULT_DELAY = 10;
  const MAX_DELAY_SEC = 30;
  const BUFFER_SCALE_WIDTH = 640;
  const CAPTURE_INTERVAL_MS = 1000 / 24;
  const FPS_WINDOW_MS = 2000; // 実効fps算出のための移動窓
  const DEFAULT_SLOW_WINDOW_SEC = 5;
  const DEFAULT_SLOW_RATE = 1 / 3;

  // ---- 起動時の環境診断 ----
  // getUserMedia()は失敗時に必ず例外を投げるとは限らず、環境によっては

  // そのため、まず静的にわかる情報を表示しておく。
  function buildDiagText() {
    const secure = window.isSecureContext;
    const hasMediaDevices = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
    const isTopFrame = window.self === window.top;
    const lines = [
      "protocol: " + location.protocol,
      "secureContext: " + secure,
      "mediaDevices対応: " + hasMediaDevices,
      "トップフレームで実行: " + isTopFrame,
    ];
    let warning = "";
    if (location.protocol === "file:") {
      warning =
        "\n⚠ file:// で開いています。カメラ利用にはHTTPS(またはlocalhost)配信が必要です。\n" +
        "許可ダイアログが表示されないまま、この画面から進まなくなっている可能性が高いです。";
    } else if (!secure) {
      warning = "\n⚠ セキュアコンテキストではありません。HTTPS配信に切り替えてください。";
    } else if (!isTopFrame) {
      warning = "\n⚠ iframe内で開かれています。埋め込み元がカメラ権限を許可していない可能性があります。";
    }
    return lines.join(" / ") + warning;
  }

  // ---- 全画面表示 ----
  // #stage自体をFullscreen対象にすることで、header/footerはそのままDOM外(=非表示)として扱われ、
  // 映像がビューポート全体を占める。操作は#stage内の#fsControlsオーバーレイで行う。
  //
  // 既知の問題: ホーム画面に追加してstandalone起動した場合、iOS SafariではFullscreen API
  // (Element.requestFullscreen)自体が使えない、または常に拒否されることがある
  // (document.fullscreenEnabledがfalseになる、またはrequestFullscreen()が失敗する)。
  // standaloneではブラウザのアドレスバー等は元々存在しないため、その場合はネイティブAPIに
  // 頼らず、header/footerをCSSで直接隠す「疑似全画面(pseudo-fullscreen)」にフォールバックする。
  function isStandalone() {
    return (
      window.navigator.standalone === true ||
      (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches)
    );
  }
  function isFullscreenActive() {
    return !!document.fullscreenElement || appEl.classList.contains("pseudo-fullscreen");

  function updateFullscreenButton() {

  function toggleFullscreen() {
    if (document.fullscreenElement) {
      document.exitFullscreen().catch(() => {});

    if (appEl.classList.contains("pseudo-fullscreen")) {
      appEl.classList.remove("pseudo-fullscreen");

      return;

    if (isStandalone() || !document.fullscreenEnabled) {
      // standalone起動時、またはFullscreen API自体が使えない環境ではCSSフォールバックを使う
      enterPseudoFullscreen();
      return;

  // 実行させない(誤操作防止)。2回目以降のタップは通常どおり動作する。
  const UI_IDLE_MS = 4000;
  let idleTimer = null;

  function resetIdleTimer() {

  // ---- マーキング機能 ----
  // STEP11: 映像上に点・縦線・横線・角度・矢飛び出し位置を重ね描きする。
  // マーキングはセッション中のメモリ上(markings配列)にのみ保持し、IndexedDBへは保存しない。
  // 座標変換は必ずcoordinateEngine.jsのAPIを経由し、index.html側で独自の座標計算は行わない。
  let markingMode = "none"; // none/point/vertical/horizontal/angle/arrow_release/erase
  let markings = [];
  let pendingPoints = []; // 角度モード: 確定前の点(1〜2点)
  let dragStart = null; // 縦線・横線モード: ドラッグ開始位置(正規化座標)
  let dragCurrent = null; // ドラッグ中のプレビュー用

  function setMarkingMode(mode) {
    markingMode = mode;
    pendingPoints = [];
    dragStart = null;
    dragCurrent = null;
    markToolBtns.forEach((btn) => btn.classList.toggle("selected", btn.dataset.mode === mode));
    markingOverlay.classList.toggle("active", mode !== "none");
    redrawMarkingOverlay();
  }

  markingToggleBtn.addEventListener("click", () => {
    const isOpen = markingToolbar.style.display !== "none";
    if (isOpen) {
      markingToolbar.style.display = "none";
      markingToggleBtn.classList.remove("on");
      setMarkingMode("none"); // マークOFF時は通常操作へ完全に戻す
    } else {
      markingToolbar.style.display = "block";
      markingToggleBtn.classList.add("on");
    }
  });

  markToolBtns.forEach((btn) => {
    btn.addEventListener("click", () => {
      const mode = btn.dataset.mode;
      setMarkingMode(markingMode === mode ? "none" : mode); // 同じツールの再タップで解除
    });
  });

  markClearAllBtn.addEventListener("click", () => {
    if (!markings.length) return;
    if (window.confirm("マーキングをすべて消去しますか？")) {
      markings = [];
      redrawMarkingOverlay();
    }
  });

  // 画面(表示コンテナ)上の座標を、coordinateEngine経由で映像内部の正規化座標へ変換する。
  // 変換ロジック自体はここに書かず、必ずcoordinateEngine.screenToNormalizedPointを使う。
  function eventToNormalizedPoint(e) {
    const rect = displayCanvas.getBoundingClientRect();
    return CoordinateEngine.screenToNormalizedPoint(
      e.clientX - rect.left,
      e.clientY - rect.top,
      rect.width,
      rect.height,
      displayCanvas.width,
      displayCanvas.height
    );
  }

  markingOverlay.addEventListener("pointerdown", (e) => {
    if (suppressNextClick) return; // UI再表示のみのタップ(誤操作防止機能との整合)
    if (markingMode === "none") return;
    e.preventDefault();
    if (markingMode === "vertical" || markingMode === "horizontal") {
      const p = eventToNormalizedPoint(e);
      dragStart = p;
      dragCurrent = p;
      redrawMarkingOverlay();
    }
  });

  markingOverlay.addEventListener("pointermove", (e) => {
    if (markingMode === "none" || !dragStart) return;
    if (markingMode === "vertical" || markingMode === "horizontal") {
      dragCurrent = eventToNormalizedPoint(e);
      redrawMarkingOverlay();
    }
  });

  markingOverlay.addEventListener("pointerup", (e) => {
    if (suppressNextClick) return;
    if (markingMode === "none") return;
    const p = eventToNormalizedPoint(e);

    if (markingMode === "point") {
      markings.push(CoordinateEngine.createPointMarking({ x: p.x, y: p.y }));
    } else if (markingMode === "vertical") {
      if (dragStart) {
        // 開始点・終了点のX座標を平均化する。タップ(ドラッグなし)の場合も
        // 開始点=終了点なので同じ計算式でそのまま正しく機能する。
        markings.push(CoordinateEngine.createVerticalMarking({ x: (dragStart.x + p.x) / 2 }));
      }
      dragStart = null;
      dragCurrent = null;
    } else if (markingMode === "horizontal") {
      if (dragStart) {
        markings.push(CoordinateEngine.createHorizontalMarking({ y: (dragStart.y + p.y) / 2 }));
      }
      dragStart = null;
      dragCurrent = null;
    } else if (markingMode === "angle") {
      pendingPoints.push(p);
      if (pendingPoints.length === 3) {
        markings.push(CoordinateEngine.createAngleMarking({ points: pendingPoints.slice() }));
        pendingPoints = [];
      }
    } else if (markingMode === "arrow_release") {
      // timeMsは新たにperformance.now()等を取得せず、必ずPlayback Engineが管理する
      // 現在の再生位置(playback.playbackTime)を使う。
      markings.push(CoordinateEngine.createArrowReleaseMarking({ x: p.x, y: p.y, timeMs: playback.playbackTime }));
    } else if (markingMode === "erase") {
      const found = CoordinateEngine.findNearestMarking(markings, p);
      if (found) {
        markings = markings.filter((m) => m.id !== found.marking.id);
      }
    }
    redrawMarkingOverlay();
  });

  // 1件のマーキングをOverlay Canvasへ描画する(映像本体には一切触れない)
  function drawMarkingShape(ctx, m, w, h) {
    ctx.save();
    ctx.strokeStyle = "#e0533c";
    ctx.fillStyle = "#e0533c";
    ctx.lineWidth = 2;
    switch (m.type) {
      case "point":
        ctx.beginPath();
        ctx.arc(m.x * w, m.y * h, 6, 0, Math.PI * 2);
        ctx.fill();
        break;
      case "arrow_release":
        ctx.fillStyle = "#c9a13b";
        ctx.beginPath();
        ctx.arc(m.x * w, m.y * h, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.font = "16px sans-serif";
        ctx.fillText("🏹", m.x * w + 10, m.y * h - 8);
        break;
      case "vertical": {
        const x = m.x * w;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, h);
        ctx.stroke();
        break;
      }
      case "horizontal": {
        const y = m.y * h;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
        break;
      }
      case "angle": {
        const [p1, p2, p3] = m.points;
        ctx.beginPath();
        ctx.moveTo(p1.x * w, p1.y * h);
        ctx.lineTo(p2.x * w, p2.y * h);
        ctx.lineTo(p3.x * w, p3.y * h);
        ctx.stroke();
        [p1, p2, p3].forEach((p) => {
          ctx.beginPath();
          ctx.arc(p.x * w, p.y * h, 4, 0, Math.PI * 2);
          ctx.fill();
        });
        const deg = CoordinateEngine.computeAngleDegrees(m.points);
        if (deg != null) {
          ctx.font = "13px sans-serif";
          ctx.fillText(deg.toFixed(0) + "°", p2.x * w + 8, p2.y * h - 8);
        }
        break;
      }
    }
    ctx.restore();
  }

  // Overlay Canvas全体を再描画する。呼び出しは「マーキングが変化した時」「サイズが変わった時」
  // だけでよく、毎フレーム呼ぶ必要はない(displayCanvasとは別のCanvasなので、映像側の描画が
  // このCanvasの内容を消すことはない)。
  function redrawMarkingOverlay() {
    const w = markingOverlay.width;
    const h = markingOverlay.height;
    if (!w || !h) return;
    markCtx.clearRect(0, 0, w, h);
    markings.forEach((m) => drawMarkingShape(markCtx, m, w, h));

    // 確定前のプレビュー(薄く表示)
    markCtx.save();
    markCtx.globalAlpha = 0.55;
    markCtx.strokeStyle = "#e0533c";
    markCtx.fillStyle = "#e0533c";
    if ((markingMode === "vertical" || markingMode === "horizontal") && dragStart && dragCurrent) {
      if (markingMode === "vertical") {
        const x = ((dragStart.x + dragCurrent.x) / 2) * w;
        markCtx.beginPath();
        markCtx.moveTo(x, 0);
        markCtx.lineTo(x, h);
        markCtx.stroke();
      } else {
        const y = ((dragStart.y + dragCurrent.y) / 2) * h;
        markCtx.beginPath();
        markCtx.moveTo(0, y);
        markCtx.lineTo(w, y);
        markCtx.stroke();
      }
    }
    if (markingMode === "angle" && pendingPoints.length > 0) {
      markCtx.beginPath();
      pendingPoints.forEach((p, i) => {
        const x = p.x * w, y = p.y * h;
        if (i === 0) markCtx.moveTo(x, y);
        else markCtx.lineTo(x, y);
        markCtx.fillRect(x - 3, y - 3, 6, 6);
      });
      markCtx.stroke();
    }
    markCtx.restore();
  }

  // ---- スロー速度・スロー範囲の選択 ----
  // Playback EngineのplayRecentWindow(windowSec, rate)は既に汎用化されているため、
  // ここでは「選択中の値をどれにするか」を管理するだけでよい。
  function renderSlowRatePresets() {
    slowRatePresetsRow.innerHTML = "";
    SLOW_RATE_OPTIONS.forEach((rate) => {
      const b = document.createElement("button");
      b.textContent = rateFractionLabel(rate) + "倍速";
      b.className = Math.abs(rate - slowRate) < 0.001 ? "selected" : "";
      b.addEventListener("click", () => setSlowRate(rate));
      slowRatePresetsRow.appendChild(b);
    });
  }
  function renderSlowWindowPresets() {
    slowWindowPresetsRow.innerHTML = "";
    SLOW_WINDOW_OPTIONS.forEach((sec) => {
      const b = document.createElement("button");
      b.textContent = sec + "秒";
      b.className = sec === slowWindowSec ? "selected" : "";
      b.addEventListener("click", () => setSlowWindow(sec));
      slowWindowPresetsRow.appendChild(b);
    });
  }
  function setSlowRate(rate) {
    slowRate = rate;
    localStorage.setItem("slowRate", String(rate));
    renderSlowRatePresets();
    // スロー再生中に速度を変更した場合は、その場で新しい速度に切り替える
    // (playRecentWindowは現在のplaybackTimeを基準に再開するため、連打時と同じ仕組みで自然に反映される)
    const label = playback.getStateLabel();
    if (label === "SLOW" || label === "SLOW_PAUSED") {
      playback.playRecentWindow(slowWindowSec, slowRate);
    }
  }
  function setSlowWindow(sec) {
    slowWindowSec = sec;
    localStorage.setItem("slowWindowSec", String(sec));
    renderSlowWindowPresets();
    const label = playback.getStateLabel();
    if (label === "SLOW" || label === "SLOW_PAUSED") {
      playback.playRecentWindow(slowWindowSec, slowRate);
    }
  }

  // ---- 1フレーム戻る／進む ----
  // Playback Engineにframe配列を渡さない。前後の実フレーム時刻はBuffer Engineに問い合わせ、
  // その時刻へPlayback Engineのseek Toで移動したうえで、必ずpause()し、その場に留める
  // (スロー中ならSLOW_PAUSED、通常ならPAUSEになる。pause()はスロー区間情報を消さないため、
  // スロー中に踏んだ場合はスロー速度・終了予定位置を保持したまま一時停止できる)。
  function stepFrame(direction) {
    const t =
      direction < 0
        ? BufferEngine.getPreviousFrameTime(frameBuffer, playback.playbackTime)
        : BufferEngine.getNextFrameTime(frameBuffer, playback.playbackTime);
    if (t == null) return; // バッファ範囲外: 何もしない
    if (direction > 0) {
      // 「現在の遅延位置」より先のフレームがバッファに存在していても、そこへは進めない
      const bound = playback.getNewestAllowed();
      if (bound != null && t > bound) return;
    }
    playback.seekToTime(t);
    playback.pause();
  }
  stepBackBtn.addEventListener("click", () => stepFrame(-1));
  stepForwardBtn.addEventListener("click", () => stepFrame(1));

  // ---- 射の保存範囲の選択(スロー範囲と同じ選択肢を共有) ----
  function renderSaveRangePresets() {
    saveRangePresetsRow.innerHTML = "";
    SAVE_RANGE_OPTIONS.forEach((sec) => {
      const b = document.createElement("button");
      b.textContent = sec + "秒";
      b.className = sec === saveRangeSec ? "selected" : "";
      b.addEventListener("click", () => {
        saveRangeSec = sec;
        localStorage.setItem("saveRangeSec", String(sec));
        renderSaveRangePresets();
      });
      saveRangePresetsRow.appendChild(b);
    });
  }

  // ---- 射の保存 ----
  // Storage Engineへ委譲するだけ。frameBufferの配列そのものを渡すが、
  // Storage Engine側はそれを読み取るだけで、Buffer Engineの内部管理には触れない。
  let isSaving = false;
  saveShotBtn.addEventListener("click", async () => {
    if (isSaving) return;
    isSaving = true;
    saveShotBtn.disabled = true;
    saveStatus.style.display = "block";
    saveStatus.textContent = "保存中…";
    try {
      const meta = await StorageEngine.saveShot(frameBuffer, {
        playbackTime: playback.playbackTime,
        windowSec: saveRangeSec,
        oldestAvailableTime: frameBuffer.length ? frameBuffer[0].time : null,
        delaySecondsAtCapture: delaySeconds,
        jpegQuality: JPEG_QUALITY,
        onProgress: (done, total) => {
          saveStatus.textContent = "保存中 " + done + " / " + total;
        },
      });
      if (meta) {
        saveStatus.textContent = "保存しました（" + (meta.durationMs / 1000).toFixed(1) + "秒）";
        await refreshShotList();
      } else {
        saveStatus.textContent = "保存できるフレームがありませんでした。";
      }
    } catch (err) {
      console.error(err);
      saveStatus.textContent = "保存に失敗しました。";
    } finally {
      isSaving = false;
      saveShotBtn.disabled = false;
      setTimeout(() => {
        saveStatus.style.display = "none";
      }, 3000);
    }
  });

  // ---- 保存した射の一覧 ----
  function formatShotDate(ms) {
    const d = new Date(ms);
    const pad = (n) => String(n).padStart(2, "0");
    return (
      d.getFullYear() + "/" + pad(d.getMonth() + 1) + "/" + pad(d.getDate()) +
      " " + pad(d.getHours()) + ":" + pad(d.getMinutes())
    );
  }
  async function refreshShotList() {
    let shots = [];
    try {
      shots = await StorageEngine.listShots();
    } catch (err) {
      console.error(err);
      shotListEl.textContent = "一覧の読み込みに失敗しました。";
      return;
    }
    if (!shots.length) {
      shotListEl.textContent = "まだ保存された射はありません。";
      return;
    }
    shotListEl.innerHTML = "";
    shots
      .slice()
      .sort((a, b) => b.createdAt - a.createdAt)
      .forEach((shot) => {
        const item = document.createElement("div");
        item.className = "shot-item";
        const info = document.createElement("div");
        info.className = "shot-item-info";
        info.innerHTML =
          formatShotDate(shot.createdAt) +
          "<span>" + (shot.durationMs / 1000).toFixed(1) + "秒</span>";
        const actions = document.createElement("div");
        actions.className = "shot-item-actions";
        const playBtn = document.createElement("button");
        playBtn.textContent = "再生";
        playBtn.addEventListener("click", () => openShotReview(shot));
        const delBtn = document.createElement("button");
        delBtn.textContent = "削除";
        delBtn.className = "shot-delete";
        delBtn.addEventListener("click", async () => {
          if (!window.confirm("この射を削除しますか？")) return; // キャンセル時はStorageEngineを一切呼ばない
          delBtn.disabled = true;
          try {
            await StorageEngine.deleteShot(shot.id);
            await refreshShotList();
          } catch (err) {
            console.error(err);
            delBtn.disabled = false;
          }
        });
        actions.appendChild(playBtn);
        actions.appendChild(delBtn);
        item.appendChild(info);
        item.appendChild(actions);
        shotListEl.appendChild(item);
      });
  }

  // ---- 保存済み射の再生 ----
  // 新しい「保存動画専用再生エンジン」は作らず、PlaybackEngineの別インスタンスと
  // BufferEngine.findFrameAtをそのまま使う。ライブ側のframeBuffer/playbackとは完全に独立させる。
  let shotFrameBuffer = null; // {time(=relTime), bitmap}配列。timeは0起点の独立した時間軸。
  let shotDurationMs = 0;
  let shotPlayback = null;
  let shotReviewRafId = null;
  const shotCtx = shotReviewCanvas.getContext("2d", { alpha: false });

  // ---- STEP13: レビュー側マーキング(保存・復元) ----
  // ライブ側(markingMode/markings/markCtx等)とは変数・関数とも完全に独立させる。
  const shotMarkCtx = shotReviewMarkingOverlay.getContext("2d");
  let currentReviewShotId = null;
  let shotMarkingMode = false; // ON/OFF
  let shotMarkingTool = "draw"; // STEP14: "draw" | "erase"(ライブ側のmarkingModeとは別管理)
  let shotMarkings = []; // 読み込み済み+新規作成分。{ id, shotId, relTime, type:"freehand", points, createdAt }
  let shotMarkStroke = null; // 描画中のストローク(正規化座標の配列)。確定前はnull。

  // ---- STEP12: レビュー専用の時刻管理 ----
  // 旧実装は delaySeconds:1e9 でPlaybackEngine内部のnewestAllowedクランプを
  // 「実質無効化」しようとしていたが、newestAllowed(=nowMs - delaySeconds*1000)が
  // 極端な負数になり、oldestAvailableTime(=0)との大小関係が逆転してseekToTime(0)等が
  // 巨大な負数にクランプされ直してしまう不具合があった(実機で発覚)。
  // PlaybackEngine自体は変更せず、index.html側で「実時刻(performance.now())に依存しない
  // レビュー専用の擬似時刻」を与えることで、常にnewestAllowedがshotDurationMs(最大10秒)
  // より十分大きい値に保たれるようにする。上限(shotDurationMs)自体はこちら側で明示的に
  // クランプする(下限0はoldestAvailableTime=0でPlaybackEngine自身が正しく扱える)。
  const REVIEW_TIME_HEADROOM_MS = 1e7; // shotDurationMsの最大値(10秒)より十分大きい基準値
  const REVIEW_DELAY_SECONDS = 0.001; // 0だと(opts.delaySeconds || 10)でデフォルト10になるため、truthyな極小値にする
  let reviewClockBase = null;
  function reviewNow(realNow) {
    if (reviewClockBase === null) reviewClockBase = realNow;
    return REVIEW_TIME_HEADROOM_MS + (realNow - reviewClockBase);
  }
  function clampReviewTime(t) {
    return Math.max(0, Math.min(shotDurationMs, t));
  }
  function updateShotReviewPosition() {
    const cur = (shotPlayback ? shotPlayback.playbackTime : 0) / 1000;
    shotReviewPosition.textContent = cur.toFixed(1) + " / " + (shotDurationMs / 1000).toFixed(1) + "秒";
  }

  // ---- STEP12: レビュー専用スロー設定 ----
  // ライブ側のslowRate/slowWindowSecとは共有しない、完全に独立した変数。
  // レビュー画面を開くたびに、常にDEFAULT_SLOW_RATE/DEFAULT_SLOW_WINDOW_SEC
  // (ライブと同じデフォルト定数)から開始する(ライブの現在設定は引き継がない)。
  let reviewSlowRate = DEFAULT_SLOW_RATE;
  let reviewSlowWindowSec = DEFAULT_SLOW_WINDOW_SEC;

  function renderShotSlowRatePresets() {
    shotSlowRatePresetsRow.innerHTML = "";
    SLOW_RATE_OPTIONS.forEach((rate) => {
      const b = document.createElement("button");
      b.textContent = rateFractionLabel(rate) + "倍速";
      b.className = Math.abs(rate - reviewSlowRate) < 0.001 ? "selected" : "";
      b.addEventListener("click", () => setReviewSlowRate(rate));
      shotSlowRatePresetsRow.appendChild(b);
    });
  }
  function renderShotSlowWindowPresets() {
    shotSlowWindowPresetsRow.innerHTML = "";
    SLOW_WINDOW_OPTIONS.forEach((sec) => {
      const b = document.createElement("button");
      b.textContent = sec + "秒";
      b.className = sec === reviewSlowWindowSec ? "selected" : "";
      b.addEventListener("click", () => setReviewSlowWindow(sec));
      shotSlowWindowPresetsRow.appendChild(b);
    });
  }
  function setReviewSlowRate(rate) {
    reviewSlowRate = rate;
    renderShotSlowRatePresets();
    const label = shotPlayback ? shotPlayback.getStateLabel() : "";
    if (label === "SLOW" || label === "SLOW_PAUSED") reviewSlowCheck();
  }
  function setReviewSlowWindow(sec) {
    reviewSlowWindowSec = sec;
    renderShotSlowWindowPresets();
    const label = shotPlayback ? shotPlayback.getStateLabel() : "";
    if (label === "SLOW" || label === "SLOW_PAUSED") reviewSlowCheck();
  }
  function reviewSlowCheck() {
    if (!shotPlayback) return;
    // ライブのplayRecentWindow()はデフォルトで終了時にgoLive()するが、レビューには
    // 「ライブへ戻る」という概念が無いため、区間終端でそのまま一時停止させる。
    shotPlayback.playRecentWindow(reviewSlowWindowSec, reviewSlowRate, () => {
      shotPlayback.pause();
    });
  }

  // ---- STEP12: マーキングOverlay(レビュー側)のサイズ同期 ----
  // 今回は配置とサイズ同期のみ。実際の描画・タップ操作・保存はまだ実装しない
  // (pointer-eventsは常にnoneのまま=操作を一切受け付けない)。
  function syncShotReviewMarkingOverlaySize() {
    shotReviewMarkingOverlay.width = shotReviewCanvas.width;
    shotReviewMarkingOverlay.height = shotReviewCanvas.height;
  }

  // 現在表示中の実フレーム時刻とrelTimeが完全一致するマーキングだけを対象にする(A案)。
  // 「描いた時刻以降ずっと表示」ではなく、そのフレームでのみ表示する仕様。
  function visibleShotMarkings() {
    if (!shotFrameBuffer || !shotFrameBuffer.length || !shotPlayback) return [];
    const frame = BufferEngine.findFrameAt(shotFrameBuffer, shotPlayback.playbackTime);
    if (!frame) return [];
    return shotMarkings.filter((m) => m.relTime === frame.time);
  }

  function drawShotMarkingShape(ctx, m, w, h) {
    if (m.type !== "freehand" || !Array.isArray(m.points) || m.points.length < 2) return;
    ctx.save();
    ctx.strokeStyle = "#e0533c";
    ctx.lineWidth = 2;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.beginPath();
    m.points.forEach((p, i) => {
      const x = p.x * w, y = p.y * h;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.stroke();
    ctx.restore();
  }

  // 呼び出しは毎フレーム(再生ループ内)。表示すべきマーキングが再生時刻によって
  // 切り替わる仕様(A案)のため、ライブ側のredrawMarkingOverlay()と違い、
  // 「変化があった時だけ」ではなく毎フレーム再評価する。
  function redrawShotReviewMarkingOverlay() {
    const w = shotReviewMarkingOverlay.width;
    const h = shotReviewMarkingOverlay.height;
    if (!w || !h) return;
    shotMarkCtx.clearRect(0, 0, w, h);
    visibleShotMarkings().forEach((m) => drawShotMarkingShape(shotMarkCtx, m, w, h));

    // 描画中(未確定・未保存)のストロークのプレビュー
    if (shotMarkStroke && shotMarkStroke.length > 1) {
      drawShotMarkingShape(shotMarkCtx, { type: "freehand", points: shotMarkStroke }, w, h);
    }
  }

  // 画面(shotReviewCanvas)上の座標を、coordinateEngine経由で正規化座標へ変換する。
  // ライブ側のeventToNormalizedPoint()と同じ考え方だが、対象Canvasが異なるため別関数にする。
  function shotEventToNormalizedPoint(e) {
    const rect = shotReviewCanvas.getBoundingClientRect();
    return CoordinateEngine.screenToNormalizedPoint(
      e.clientX - rect.left,
      e.clientY - rect.top,
      rect.width,
      rect.height,
      shotReviewCanvas.width,
      shotReviewCanvas.height
    );
  }

  function setShotMarkingTool(tool) {
    shotMarkingTool = tool;
    shotMarkStroke = null;
    shotMarkToolBtns.forEach((btn) => btn.classList.toggle("selected", btn.dataset.tool === tool));
    redrawShotReviewMarkingOverlay();
  }
  shotMarkToolBtns.forEach((btn) => {
    btn.addEventListener("click", () => setShotMarkingTool(btn.dataset.tool));
  });

  function setShotMarkingMode(on) {
    shotMarkingMode = on;
    shotMarkStroke = null;
    shotMarkingToggleBtn.classList.toggle("on", on);
    shotReviewMarkingOverlay.classList.toggle("active", on);
    shotMarkingToolbar.style.display = on ? "block" : "none";
    if (on) setShotMarkingTool("draw"); // ONにするたびに「描く」から始める(基本状態)
    // 描画・消去中に映像が動くと位置がずれるため、マーキングONにした瞬間は一時停止する。
    // (レビューCanvas本体の再生処理とは別の入力経路として扱うだけで、再生ロジック自体は変更しない)
    if (on && shotPlayback && shotPlayback.getStateLabel() !== "PAUSE") {
      shotPlayback.pause();
    }
    redrawShotReviewMarkingOverlay();
  }
  shotMarkingToggleBtn.addEventListener("click", () => setShotMarkingMode(!shotMarkingMode));

  // STEP14: タップ位置に最も近いマーキングを1件削除する(消去モード)。
  // 対象は「現在表示中(=現在フレームとrelTimeが一致)のマーキングだけ」に限定してから
  // CoordinateEngine.findNearestMarking()に渡す(他の時刻のマーキングを誤って消さないため)。
  // 距離計算・しきい値は独自実装せず、既存のfindNearestMarking()/DEFAULT_ERASE_THRESHOLDをそのまま使う。
  async function eraseShotMarkingAt(point) {
    const candidates = visibleShotMarkings();
    const found = CoordinateEngine.findNearestMarking(candidates, point);
    if (!found) return;
    const targetId = found.marking.id;
    shotMarkings = shotMarkings.filter((m) => m.id !== targetId); // 現在開いている射のメモリ上配列からのみ削除
    redrawShotReviewMarkingOverlay();
    try {
      await StorageEngine.deleteMarking(targetId);
    } catch (err) {
      console.error("マーキングの削除に失敗しました:", err);
    }
  }

  shotMarkClearAllBtn.addEventListener("click", async () => {
    if (!currentReviewShotId || !shotMarkings.length) return; // 0件なら何もしない
    if (!window.confirm("この射のマーキングをすべて削除しますか？")) return; // キャンセル時は何も変更しない
    const shotId = currentReviewShotId;
    try {
      await StorageEngine.deleteShotMarkings(shotId); // 現在の射(shotId)のものだけを対象にする
    } catch (err) {
      console.error("マーキングの全消去に失敗しました:", err);
      return; // IndexedDB側が失敗した場合、メモリ側もあえて変更せず整合性を優先する
    }
    shotMarkings = [];
    redrawShotReviewMarkingOverlay();
  });

  shotReviewMarkingOverlay.addEventListener("pointerdown", (e) => {
    if (!shotMarkingMode) return;
    e.preventDefault();
    if (shotMarkingTool === "draw") {
      shotMarkStroke = [shotEventToNormalizedPoint(e)];
      redrawShotReviewMarkingOverlay();
    }
    // 消去モードではpointerdownでは何もしない(pointerupでタップ位置を確定して消去する)
  });
  shotReviewMarkingOverlay.addEventListener("pointermove", (e) => {
    if (!shotMarkingMode || shotMarkingTool !== "draw" || !shotMarkStroke) return;
    shotMarkStroke.push(shotEventToNormalizedPoint(e));
    redrawShotReviewMarkingOverlay();
  });
  shotReviewMarkingOverlay.addEventListener("pointercancel", () => {
    // iPad Safariでのジェスチャー割り込み等でpointerupが来ないケースへの保険。
    // 未確定のストロークを保存せずに捨てるだけで、既存の描画・消去ロジックには影響しない。
    shotMarkStroke = null;
    redrawShotReviewMarkingOverlay();
  });
  shotReviewMarkingOverlay.addEventListener("pointerup", async (e) => {
    if (!shotMarkingMode) return;

    if (shotMarkingTool === "erase") {
      await eraseShotMarkingAt(shotEventToNormalizedPoint(e));
      return;
    }

    // ---- 描くモード(STEP13から維持) ----
    if (!shotMarkStroke) return;
    const strokePoints = shotMarkStroke;
    shotMarkStroke = null;
    if (strokePoints.length < 2 || !shotFrameBuffer || !shotPlayback || !currentReviewShotId) {
      redrawShotReviewMarkingOverlay();
      return;
    }
    // relTimeは、確定した瞬間に実際に表示されている実フレームの時刻をそのまま使う
    // (連続値のplaybackTimeではなく、BufferEngine.findFrameAt()の結果を使うことで、
    // 表示側のvisibleShotMarkings()と誤差なく完全一致比較できるようにする)。
    const frame = BufferEngine.findFrameAt(shotFrameBuffer, shotPlayback.playbackTime);
    if (!frame) {
      redrawShotReviewMarkingOverlay();
      return;
    }
    const marking = {
      id: CoordinateEngine.generateMarkingId(),
      shotId: currentReviewShotId,
      relTime: frame.time,
      type: "freehand",
      points: strokePoints.map((p) => CoordinateEngine.clampNormalizedPoint(p)),
      createdAt: Date.now(),
    };
    shotMarkings.push(marking);
    redrawShotReviewMarkingOverlay();
    // ストローク完了時に自動保存する(明示的な「保存」ボタンは追加しない)
    try {
      await StorageEngine.saveMarking(marking);
    } catch (err) {
      console.error("マーキングの保存に失敗しました:", err);
    }
  });

  async function openShotReview(shot) {
    shotReviewTitle.textContent = formatShotDate(shot.createdAt) + "（" + (shot.durationMs / 1000).toFixed(1) + "秒）";
    shotReviewOverlay.style.display = "flex";
    shotReviewCanvas.width = 0; // ロード中は前の内容を残さない
    try {
      shotFrameBuffer = await StorageEngine.loadShotFrames(shot.id);
    } catch (err) {
      console.error(err);
      closeShotReview();
      return;
    }
    if (!shotFrameBuffer.length) {
      closeShotReview();
      return;
    }
    shotDurationMs = shotFrameBuffer[shotFrameBuffer.length - 1].time;
    shotReviewCanvas.width = shotFrameBuffer[0].bitmap.width;
    shotReviewCanvas.height = shotFrameBuffer[0].bitmap.height;
    syncShotReviewMarkingOverlaySize();

    // STEP13: この射に紐づくマーキングを読み込む。失敗しても動画レビュー自体は続行する。
    currentReviewShotId = shot.id;
    try {
      shotMarkings = await StorageEngine.loadShotMarkings(shot.id);
    } catch (err) {
      console.error("マーキングの読み込みに失敗しました:", err);
      shotMarkings = [];
    }
    setShotMarkingMode(false); // 開くたびにOFFから開始する

    // レビューを開くたびに、レビュー専用スロー設定を常にデフォルトへ戻す
    // (ライブの現在設定を引き継がない。ライブとレビューは独立した操作環境とする)
    reviewSlowRate = DEFAULT_SLOW_RATE;
    reviewSlowWindowSec = DEFAULT_SLOW_WINDOW_SEC;
    renderShotSlowRatePresets();
    renderShotSlowWindowPresets();

    reviewClockBase = null; // レビュー専用時計をこのセッション用にリセット
    shotPlayback = new PlaybackEngine.PlaybackEngine({ delaySeconds: REVIEW_DELAY_SECONDS });
    shotPlayback.update(reviewNow(performance.now()), 0);
    shotPlayback.seekToTime(0);
    shotPlayback.playbackTime = clampReviewTime(shotPlayback.playbackTime);
    shotPlayback.pause();
    shotPlayPauseBtn.textContent = "再生";
    updateShotReviewPosition();

    if (shotReviewRafId) cancelAnimationFrame(shotReviewRafId);
    const loop = (now) => {
      if (shotReviewOverlay.style.display === "none") return;
      const t = shotPlayback.update(reviewNow(now), 0);
      shotPlayback.playbackTime = clampReviewTime(t); // 保存済みクリップの範囲(0〜shotDurationMs)でクランプ
      const frame = BufferEngine.findFrameAt(shotFrameBuffer, shotPlayback.playbackTime);
      if (frame) {
        shotCtx.drawImage(frame.bitmap, 0, 0, shotReviewCanvas.width, shotReviewCanvas.height);
      }
      shotPlayPauseBtn.textContent = shotPlayback.getStateLabel() === "PAUSE" ? "再生" : "一時停止";
      updateShotReviewPosition();
      redrawShotReviewMarkingOverlay(); // 再生時刻に応じて表示するマーキングが切り替わる(A案)
      shotReviewRafId = requestAnimationFrame(loop);
    };
    shotReviewRafId = requestAnimationFrame(loop);
  }

  function closeShotReview() {
    setShotMarkingMode(false);
    shotReviewOverlay.style.display = "none";
    if (shotReviewRafId) cancelAnimationFrame(shotReviewRafId);
    shotReviewRafId = null;
    // 保存済み射のImageBitmapは、ライブのframeBufferとは無関係の一時データなので
    // 画面を閉じたら明示的にcloseして解放する
    if (shotFrameBuffer) {
      for (const f of shotFrameBuffer) {
        try { f.bitmap.close(); } catch (e) {}
      }
    }
    shotFrameBuffer = null;
    shotPlayback = null;
    shotMarkings = [];
    currentReviewShotId = null;
  }
  shotReviewClose.addEventListener("click", closeShotReview);
  shotPlayPauseBtn.addEventListener("click", () => {
    if (!shotPlayback) return;
    if (shotPlayback.getStateLabel() === "PAUSE") shotPlayback.resume();
    else shotPlayback.pause();
  });
  shotStepBackBtn.addEventListener("click", () => {
    if (!shotPlayback || !shotFrameBuffer) return;
    const t = BufferEngine.getPreviousFrameTime(shotFrameBuffer, shotPlayback.playbackTime);
    if (t == null) return;
    shotPlayback.seekToTime(t);
    shotPlayback.playbackTime = clampReviewTime(shotPlayback.playbackTime);
    shotPlayback.pause(); // 1F操作後は必ずPAUSE系で停止する(STEP8の仕様を維持)
    updateShotReviewPosition();
  });
  shotStepForwardBtn.addEventListener("click", () => {
    if (!shotPlayback || !shotFrameBuffer) return;
    const t = BufferEngine.getNextFrameTime(shotFrameBuffer, shotPlayback.playbackTime);
    if (t == null || t > shotDurationMs) return;
    shotPlayback.seekToTime(t);
    shotPlayback.playbackTime = clampReviewTime(shotPlayback.playbackTime);
    shotPlayback.pause(); // 1F操作後は必ずPAUSE系で停止する(STEP8の仕様を維持)
    updateShotReviewPosition();
  });
  shotSeekBackBtn.addEventListener("click", () => {
    if (!shotPlayback) return;
    shotPlayback.seekBy(-SEEK_STEP_SEC);
    shotPlayback.playbackTime = clampReviewTime(shotPlayback.playbackTime);
    updateShotReviewPosition();
  });
  shotSeekForwardBtn.addEventListener("click", () => {
    if (!shotPlayback) return;
    shotPlayback.seekBy(SEEK_STEP_SEC);
    shotPlayback.playbackTime = clampReviewTime(shotPlayback.playbackTime);
    updateShotReviewPosition();
  });
  shotSlowCheckBtn.addEventListener("click", reviewSlowCheck);

  flipBtn.addEventListener("click", async () => {
    facingMode = facingMode === "environment" ? "user" : "environment";
    localStorage.setItem("facingMode", facingMode);
    await startCamera();
  });

  // ---- 再生コントロール（Playback Engineの状態を操作するだけ。frameBufferには触れない）----
  // 通常フッターと全画面オーバーレイの両方のボタンに同じ挙動を割り当てる。
  seekBackBtns.forEach((btn) => btn.addEventListener("click", () => playback.seekBy(-SEEK_STEP_SEC)));
  seekForwardBtns.forEach((btn) => btn.addEventListener("click", () => playback.seekBy(SEEK_STEP_SEC)));
  goLiveBtns.forEach((btn) => btn.addEventListener("click", () => playback.goLive()));
  slowCheckBtns.forEach((btn) =>
    btn.addEventListener("click", () => playback.playRecentWindow(slowWindowSec, slowRate))
  );
  playPauseBtns.forEach((btn) =>
    btn.addEventListener("click", () => {
      const label = playback.getStateLabel();
      if (label === "PAUSE" || label === "SLOW_PAUSED") {
        playback.resume();
      } else {
        playback.pause();
      }
    })
  );

  // ---- バッファ全クリア（カメラ切替・再起動時）----
  function clearBuffer() {
    for (const f of frameBuffer) {
      try { f.bitmap.close(); } catch (e) {}
    }
    frameBuffer.length = 0;
    captureTimestamps.length = 0;
  }

  // ---- カメラ起動 ----
  async function startCamera() {
    setMessage("カメラへのアクセスを準備しています…");
    setStatus("接続中…", false);
    showDiag();
    running = false;

    cameraGeneration += 1; // このタイミング以降に確定するBitmapのみ有効
    const myGeneration = cameraGeneration;

    if (stream) {
      stream.getTracks().forEach((t) => t.stop());
      stream = null;
    }
    clearBuffer();
    playback.goLive(); // バッファが入れ替わるため、再生位置の手動操作状態を持ち越さない

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setMessage("このブラウザはカメラ機能に対応していません。");
      showDiag();
      setStatus("非対応", false);
      return;
    }

    // getUserMedia()は、許可ダイアログ自体が表示されない環境(file://での実行など)では
    // 成功も失敗もせず無言で止まることがある。一定時間応答がなければヒントを追加表示する。
    const watchdog = setTimeout(() => {
      showDiag(
        "⚠ " + 8 + "秒経っても応答がありません。許可ダイアログが表示されていないか確認してください。"
      );
    }, 8000);

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: facingMode },
          width: { ideal: 1280 },
          height: { ideal: 720 },
          frameRate: { ideal: 30 },
        },
      });
    } catch (err) {
      clearTimeout(watchdog);
      console.error(err);
      if (err && err.name === "NotAllowedError") {
        setMessage("カメラの利用が許可されていません。ブラウザの設定でカメラへのアクセスを許可してください。");
      } else if (err && err.name === "NotFoundError") {
        setMessage("利用できるカメラが見つかりませんでした。");
      } else {
        setMessage("カメラを起動できませんでした（" + (err && err.message ? err.message : "不明なエラー") + "）。");
      }
      showDiag();
      setStatus("エラー", false);
      return;
    }
    clearTimeout(watchdog);

    if (myGeneration !== cameraGeneration) {
      // 切替がさらに発生していた場合はこのstreamは破棄
      stream.getTracks().forEach((t) => t.stop());
      return;
    }

    sourceVideo.srcObject = stream;
    await sourceVideo.play().catch(() => {});

    applyOrientation();

    setMessage("");
    setStatus("LIVE（遅延中）", true);
    running = true;
  }

  // ---- 映像の向き補正 ----
  // iOS Safariでは、<video>要素は自動的に正しい向きで表示されるが、
  // CanvasへdrawImage()した場合はカメラセンサーの素の向き(多くは縦長)のまま
  // 描画されてしまうことがある。
  //
  // 「映像が横長か縦長か」と「画面が横長か縦長か」を比較するだけの判定では、
  // 横長と横長(向かい合う2方向)や縦長と縦長(向かい合う2方向)を区別できず、
  // デバイスを180°回転(左右持ち替え)した際に向きがズレたまま検知できない、
  // という不具合があった。そのため、screen.orientation.angle（0/90/180/270°の
  // 実際の画面角度）を直接使う方式に変更する。
  //
  // sensorOffsetDeg は「画面角度が0°のときに映像を正しい向きにするための
  // 固定の補正値」であり、端末・カメラの個体差を表す。これはユーザーが
  // 「映像回転」ボタンで一度調整すれば、以後はどの向きに回転させても
  // (screen.orientation.angleを毎回足し引きするだけなので)正しく追従する。
  let currentRotation = 0; // 実際に適用中の回転角(0/90/180/270)
  let sensorOffsetDeg = Number(localStorage.getItem("sensorOffsetDeg")) || 0;

  function getScreenAngle() {
    if (screen.orientation && typeof screen.orientation.angle === "number") {
      return screen.orientation.angle;
    }
    if (typeof window.orientation === "number") {
      return ((window.orientation % 360) + 360) % 360;
    }
    return 0;
  }

  function computeRotation() {
    return ((sensorOffsetDeg + getScreenAngle()) % 360 + 360) % 360;
  }

  function applyOrientation() {
    if (!stream) return;
    const track = stream.getVideoTracks()[0];
    if (!track) return;
    const settings = track.getSettings ? track.getSettings() : {};
    const srcW = settings.width || sourceVideo.videoWidth || 1280;
    const srcH = settings.height || sourceVideo.videoHeight || 720;

    const rotation = computeRotation();
    const swapped = rotation === 90 || rotation === 270;
    const outW = swapped ? srcH : srcW;
    const outH = swapped ? srcW : srcH;

    const sizeChanged = outW !== displayCanvas.width || outH !== displayCanvas.height;
    if (rotation !== currentRotation || sizeChanged) {
      currentRotation = rotation;
      const scale = BUFFER_SCALE_WIDTH / outW;
      bufferCanvas.width = Math.round(outW * scale);
      bufferCanvas.height = Math.round(outH * scale);
      displayCanvas.width = outW;
      displayCanvas.height = outH;
      markingOverlay.width = outW;
      markingOverlay.height = outH;
      // 向き・サイズが変わると既存バッファの内容と整合しなくなるため破棄する
      clearBuffer();
      playback.goLive();
      // 映像の解像度・向きが変わるとマーキングの前提が崩れるため、既存マーキングも破棄する
      // (正規化座標自体は解像度非依存だが、フレーム内容そのものが変わるため意味が無くなる)
      markings.length = 0;
      pendingPoints.length = 0;
      redrawMarkingOverlay();
    }
  }

  // videoソースをrotationDeg分回転させてctx(出力サイズoutW×outH)へ描画する
  function drawRotatedFrame(ctx, source, rotationDeg, outW, outH) {
    ctx.save();
    switch (rotationDeg) {
      case 90:
        ctx.translate(outW, 0);
        ctx.rotate(Math.PI / 2);
        ctx.drawImage(source, 0, 0, outH, outW);
        break;
      case 180:
        ctx.translate(outW, outH);
        ctx.rotate(Math.PI);
        ctx.drawImage(source, 0, 0, outW, outH);
        break;
      case 270:
        ctx.translate(0, outH);
        ctx.rotate(-Math.PI / 2);
        ctx.drawImage(source, 0, 0, outH, outW);
        break;
      default:
        ctx.drawImage(source, 0, 0, outW, outH);
    }
    ctx.restore();
  }

  rotateViewBtn.addEventListener("click", () => {
    // sensorOffsetDegは画面角度に依存しない固定値として保存するため、
    // ここで一度直せば、以後どの向きに回転させても正しく追従する。
    sensorOffsetDeg = (sensorOffsetDeg + 90) % 360;
    localStorage.setItem("sensorOffsetDeg", String(sensorOffsetDeg));
    applyOrientation();
  });

  // デバイスの向きが変わったら再計算する
  window.addEventListener("resize", () => applyOrientation());
  window.addEventListener("orientationchange", () => applyOrientation());
  if (screen.orientation && screen.orientation.addEventListener) {
    screen.orientation.addEventListener("change", () => applyOrientation());
  }

  // ---- 横向き案内 ----
  function updateOrientationHint() {
    const isPortrait = window.innerHeight > window.innerWidth;
    orientationHint.classList.toggle("show", isPortrait);
  }
  window.addEventListener("resize", updateOrientationHint);
  window.addEventListener("orientationchange", updateOrientationHint);
  updateOrientationHint();

  // ---- time昇順を保った挿入・時刻検索は bufferEngine.js の共通実装を利用 ----
  // (ブラウザ実装とテストコードでロジックが乖離しないようにするため)
  const insertSorted = (frame) => BufferEngine.insertSorted(frameBuffer, frame);

  // ---- フレーム取り込み ----
  function captureFrame(now) {
    if (now - lastCaptureTime < CAPTURE_INTERVAL_MS) return;
    if (sourceVideo.readyState < 2) return;
    lastCaptureTime = now;

    const myGeneration = cameraGeneration;
    drawRotatedFrame(bufferCtx, sourceVideo, currentRotation, bufferCanvas.width, bufferCanvas.height);

    pendingBitmapCount++;
    createImageBitmap(bufferCanvas)
      .then((bmp) => {
        pendingBitmapCount--;
        // カメラが切り替わった後に完了したBitmapは破棄する（混入防止）
        if (myGeneration !== cameraGeneration) {
          bmp.close();
          return;
        }
        insertSorted({ time: now, bitmap: bmp });
        captureTimestamps.push(now);

        // 統計用の古い履歴を間引く
        const fpsCutoff = now - FPS_WINDOW_MS;
        while (captureTimestamps.length && captureTimestamps[0] < fpsCutoff) {
          captureTimestamps.shift();
        }

        // 古いフレームの破棄（設定した保持時間を超えたら破棄）
        const cutoff = now - BUFFER_RETENTION_SEC * 1000;
        while (frameBuffer.length && frameBuffer[0].time < cutoff) {
          const old = frameBuffer.shift();
          old.bitmap.close();
        }
      })
      .catch(() => {
        pendingBitmapCount--;
      });
  }

  // ---- 時刻検索は bufferEngine.js の共通実装(二分探索)を利用 ----
  const findFrameAt = (targetTime) => BufferEngine.findFrameAt(frameBuffer, targetTime);

  // ---- 表示 ----
  // 「どのtimestampを表示するか」はPlayback Engineが決定し、
  // 実際のフレーム取得はBuffer EngineのfindFrameAtに委ねる。
  // Playback Engineはframe配列を直接加工しない(疎結合)。
  function renderFrame(now) {
    if (!running) return;

    const oldestAvailableTime = frameBuffer.length ? frameBuffer[0].time : now;
    const targetTime = playback.update(now, oldestAvailableTime);
    const frame = findFrameAt(targetTime);

    if (frame) {
      displayCtx.save();
      if (mirrored) {
        displayCtx.translate(displayCanvas.width, 0);
        displayCtx.scale(-1, 1);
      }
      displayCtx.drawImage(frame.bitmap, 0, 0, displayCanvas.width, displayCanvas.height);
      displayCtx.restore();
      delayBadge.style.display = "block";
      lastDisplayedFrameTime = frame.time;
      lastDisplayedTargetTime = targetTime;
    } else {
      delayBadge.style.display = "none";
    }

    updatePlaybackUI();
  }

  const STATE_LABEL_JA = {
    DELAY: "遅延中",
    PAUSE: "一時停止",
    REPLAY: "再生中（過去）",
    SLOW: "スロー再生中",
    SLOW_PAUSED: "スロー再生（一時停止）",
  };

  function updatePlaybackUI() {
    const label = playback.getStateLabel();
    setStatus(STATE_LABEL_JA[label] || label, label === "DELAY");
    const isSlow = label === "SLOW" || label === "SLOW_PAUSED";
    slowIndicator.style.display = isSlow ? "block" : "none";
    if (isSlow) {
      // slowRate/slowWindowSecは「直近にplayRecentWindow()へ渡した値」と常に同期しているため、
      // Playback Engine側に速度・範囲を問い合わせるgetterを増やさずにここで参照してよい。
      slowIndicator.textContent = "SLOW " + rateFractionLabel(slowRate) + "x (" + slowWindowSec + "s)";
    }
    const playPauseText = label === "PAUSE" || label === "SLOW_PAUSED" ? "再生" : "一時停止";
    playPauseBtns.forEach((btn) => (btn.textContent = playPauseText));
    goLiveBtns.forEach((btn) => (btn.disabled = label === "DELAY"));
    // スロー確認中は、映像確認に集中できるよう補助コントロールを自動的に隠す
    appEl.classList.toggle("focus-mode", isSlow);
  }

  // ---- デバッグ表示 ----
  let lastDebugUpdate = 0;
  function updateDebugPanel(now) {
    if (!debugMode) return;
    if (now - lastDebugUpdate < 250) return; // 更新頻度を抑える
    lastDebugUpdate = now;

    const effFps = captureTimestamps.length > 1
      ? ((captureTimestamps.length - 1) / ((captureTimestamps[captureTimestamps.length - 1] - captureTimestamps[0]) / 1000)).toFixed(1)
      : "-";

    const bufDurationSec = frameBuffer.length
      ? ((frameBuffer[frameBuffer.length - 1].time - frameBuffer[0].time) / 1000).toFixed(2)
      : "0";

    const camRes = sourceVideo.videoWidth ? (sourceVideo.videoWidth + "x" + sourceVideo.videoHeight) : "-";
    const bufRes = bufferCanvas.width ? (bufferCanvas.width + "x" + bufferCanvas.height) : "-";

    let memText = "取得不可";
    if (performance.memory) {
      memText = (performance.memory.usedJSHeapSize / 1048576).toFixed(1) + " MB";
    }

    let delayDiffText = "-";
    if (lastDisplayedFrameTime !== null) {
      const actualDelayMs = now - lastDisplayedFrameTime;
      const diffMs = actualDelayMs - delaySeconds * 1000;
      delayDiffText = (diffMs >= 0 ? "+" : "") + diffMs.toFixed(0) + " ms";
    }

    const pendingWarn = pendingBitmapCount > 10 ? ' class="warn"' : "";

    debugPanel.innerHTML =
      row("カメラ解像度", camRes) +
      row("バッファ解像度", bufRes) +
      row("バッファ枚数", frameBuffer.length + " 枚") +
      row("バッファ長", bufDurationSec + " 秒") +
      row("実効fps", effFps) +
      row("設定遅延", delaySeconds + " 秒") +
      row("再生状態", playback.getStateLabel()) +
      row("実遅延との差", delayDiffText) +
      `<div class="row"><span>Bitmap待ち</span><span${pendingWarn}>${pendingBitmapCount}</span></div>` +
      row("JSヒープ", memText);
  }
  function row(label, value) {
    return `<div class="row"><span>${label}</span><span>${value}</span></div>`;
  }

  function loop() {
    const now = performance.now();
    if (running) {
      captureFrame(now);
      renderFrame(now);
    }
    updateDebugPanel(now);
    requestAnimationFrame(loop);
  }

  // ---- 初期化 ----
  delayValueLabel.textContent = delaySeconds;
  renderPresets();
  renderSlowRatePresets();
  renderSlowWindowPresets();
  renderSaveRangePresets();
  refreshShotList();
  startCamera();
  requestAnimationFrame(loop);
})();
</script>

<!--
  オフライン起動用のService Worker登録。
  ・アプリ本体(このindex.htmlや各エンジンJS、アイコン、manifest)のみをキャッシュ対象とする。
  ・カメラ映像やIndexedDB(保存済み射)には一切関与しない。既存のStorage Engineの
    仕組みはそのまま。
  ・登録に失敗しても(対応ブラウザでない場合や、file://等の非対応環境も含む)、
    このtry/catchでにぎりつぶすだけで、通常のオンライン動作には一切影響しない。
  ・メインのアプリ初期化(上のIIFE)とは完全に独立しており、カメラ起動等をブロックしない。
-->
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch((err) => {
        console.warn("[PWA] Service Worker登録に失敗しました(オフライン起動は無効のまま通常動作します):", err);
      });
    });
  }
</script>
</body>
</html>
