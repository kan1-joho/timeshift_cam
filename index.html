<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="射タイムシフトカメラ">
<title>射タイムシフトカメラ</title>
<style>
  :root {
    --bg: #15140f;
    --bg-panel: #1e1c15;
    --line: #34302380;
    --text: #ece6d6;
    --text-dim: #a49d87;
    --accent: #b2402c;
    --accent-dim: #7a2c1f;
    --ok: #5c8a5c;
    --warn: #c9a13b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    overscroll-behavior: none;
    user-select: none;
  }
  #app {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
  }
  header {
    padding: max(12px, env(safe-area-inset-top)) 16px 10px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    border-bottom: 1px solid var(--line);
  }
  header h1 {
    font-size: 16px; font-weight: 600; margin: 0; letter-spacing: 0.02em;
    flex-shrink: 0;
  }
  #headerRight { display: flex; align-items: center; gap: 10px; }
  #status { font-size: 12px; color: var(--text-dim); }
  #status.live { color: var(--ok); }
  #debugToggle {
    font-size: 11px; padding: 4px 9px; border-radius: 6px;
    background: transparent; border: 1px solid var(--line); color: var(--text-dim);
  }
  #debugToggle.on { color: var(--warn); border-color: var(--warn); }

  #stage {
    position: relative; flex: 1; min-height: 0;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  #displayCanvas {
    max-width: 100%; max-height: 100%;
    width: 100%; height: 100%;
    object-fit: contain;
  }
  #stageMessage {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; gap: 14px;
    color: var(--text-dim); font-size: 15px; line-height: 1.8;
  }
  #stageMessage p { margin: 0; max-width: 46em; }
  #diagLine {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px; color: var(--text-dim); opacity: 0.75;
    white-space: pre-wrap; max-width: 46em;
  }
  #diagLine .bad { color: var(--warn); }
  #delayBadge {
    position: absolute; top: 14px; left: 14px;
    background: rgba(21,20,15,0.72);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
    letter-spacing: 0.03em;
    color: var(--text);
    pointer-events: none;
  }
  #delayBadge b { color: var(--accent); font-weight: 700; }

  #debugPanel {
    position: absolute; top: 14px; right: 14px;
    background: rgba(10,10,8,0.82);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 11px;
    line-height: 1.7;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--text-dim);
    pointer-events: none;
    display: none;
    max-width: 62vw;
  }
  #debugPanel .warn { color: var(--warn); }
  #debugPanel .row { display: flex; justify-content: space-between; gap: 12px; }
  #debugPanel .row span:last-child { color: var(--text); }

  footer {
    padding: 8px 12px max(8px, env(safe-area-inset-bottom));
    background: var(--bg-panel);
    border-top: 1px solid var(--line);
  }
  .row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .row + .row { margin-top: 6px; }
  .label { font-size: 10px; color: var(--text-dim); margin-bottom: 4px; letter-spacing: 0.04em; }
  button {
    font-family: inherit;
    border: 1px solid var(--line);
    background: #262319;
    color: var(--text);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  button:active { background: #332e20; }
  button.selected { background: var(--accent-dim); border-color: var(--accent); color: #fff; }
  button.wide { flex: 1; }
  button.grow2 { flex: 2; }
  button.adjust { min-width: 42px; text-align: center; font-weight: 700; }
  button.primary {
    background: var(--accent); border-color: var(--accent); color: #fff;
    font-weight: 700; padding: 10px 14px; font-size: 15px;
  }
  button.primary:active { background: var(--accent-dim); }
  button.secondary-action {
    background: transparent; border: 1px solid var(--ok); color: var(--ok);
    padding: 8px 14px; font-size: 13px; font-weight: 600;
  }
  /* 5秒戻る(使用頻度が高い)を5秒進むより明確に大きく・濃くする */
  button.seek-major { flex: 1.3; font-weight: 600; }
  button.seek-minor { flex: 0.7; font-size: 11px; color: var(--text-dim); }
  button:disabled { opacity: 0.4; }
  #slowIndicator {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #fff;
    font-size: 13px; font-weight: 700; letter-spacing: 0.05em;
    padding: 6px 14px; border-radius: 999px;
    display: none;
    pointer-events: none;
  }
  #privacyNote { font-size: 10px; color: var(--text-dim); text-align: center; margin: 8px 0 0; line-height: 1.5; }

  #settingsToggle {
    font-size: 11px; padding: 4px 9px; border-radius: 6px;
    background: transparent; border: 1px solid var(--line); color: var(--text-dim);
  }
  #settingsToggle.on { color: var(--text); border-color: var(--text-dim); }
  .hint-note { font-size: 10px; color: var(--text-dim); margin: 8px 0 0; line-height: 1.6; }

  /* ---- 設定パネル(遅延時間・カメラ切替等)は既定で折りたたむ ---- */
  #secondaryControls {
    display: none;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--line);
  }
  #secondaryControls.open { display: block; }

  #fullscreenToggle {
    font-size: 11px; padding: 4px 9px; border-radius: 6px;
    background: transparent; border: 1px solid var(--line); color: var(--text-dim);
  }
  #fullscreenToggle.on { color: var(--ok); border-color: var(--ok); }

  #orientationHint {
    position: fixed; inset: 0; z-index: 50;
    background: var(--bg);
    display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    text-align: center; padding: 24px;
  }
  #orientationHint.show { display: flex; }
  #orientationHint .icon { font-size: 46px; transform: rotate(90deg); color: var(--accent); }
  #orientationHint p { margin: 0; color: var(--text); font-size: 16px; line-height: 1.8; }

  /* ---- 全画面時：映像そのものをFullscreen APIで画面いっぱいに表示し、 ----
     ヘッダー・フッターはFullscreen対象(#stage)の外にあるため自動的に非表示になる。
     操作は#stage内にオーバーレイした最小限のコントロールバー(#fsControls)で行う。
     親要素のflexレイアウトの影響を受けないよう、position/sizeを強めに上書きする。 */
  #fsControls { display: none; }
  #stage:fullscreen, #stage:-webkit-full-screen {
    position: fixed !important;
    inset: 0 !important;
    width: 100vw !important;
    height: 100dvh !important;
    max-width: none !important;
    max-height: none !important;
    margin: 0 !important;
    background: #000;
    z-index: 2147483647;
  }
  #stage:fullscreen #displayCanvas, #stage:-webkit-full-screen #displayCanvas {
    width: 100%; height: 100%;
  }
  #stage:fullscreen #fsControls,
  #stage:-webkit-full-screen #fsControls {
    display: flex; flex-direction: column; gap: 8px;
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 12px 16px max(12px, env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(10,10,8,0.85), rgba(10,10,8,0) 100%);
  }
  #fsExit {
    display: none;
    position: absolute; top: 14px; right: 14px;
    background: rgba(21,20,15,0.72); border: 1px solid var(--line);
    font-size: 12px; padding: 6px 12px; border-radius: 8px;
  }
  #stage:fullscreen #fsExit, #stage:-webkit-full-screen #fsExit { display: block; }

  /* ---- スロー確認中のフォーカスモード ---- */
  /* スロー確認中は、頻繁に使わない補助コントロール(遅延設定・カメラ切替等)を隠し、
     映像とスロー操作に必要なボタンだけを残す。 */
  #app.focus-mode #secondaryControls { display: none; }
  #app.focus-mode .act-slow-check { display: none; }

  /* ---- 一定時間操作がない場合、UIを薄くする(タップで再表示) ---- */
  #app.ui-dim header, #app.ui-dim footer, #app.ui-dim #fsControls {
    opacity: 0.18;
    transition: opacity 0.4s ease;
  }
  header, footer, #fsControls { transition: opacity 0.25s ease; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>射タイムシフトカメラ</h1>
    <div id="headerRight">
      <span id="status">起動中…</span>
      <button id="settingsToggle">設定</button>
      <button id="fullscreenToggle">全画面</button>
      <button id="debugToggle">デバッグ</button>
    </div>
  </header>

  <div id="orientationHint">
    <div class="icon">⟳</div>
    <p>デバイスを横向きにしてご使用ください</p>
  </div>

  <div id="stage">
    <canvas id="displayCanvas"></canvas>
    <div id="delayBadge" style="display:none">遅延 <b id="delayValueLabel">10</b> 秒</div>
    <div id="slowIndicator">SLOW 1/3x</div>
    <div id="debugPanel"></div>
    <div id="stageMessage">
      <p id="stageMessageText">カメラへのアクセスを準備しています…</p>
      <div id="diagLine"></div>
    </div>

    <!-- 全画面時のみ表示される最小限のオーバーレイ操作パネル -->
    <button id="fsExit">全画面終了</button>
    <div id="fsControls">
      <div class="row">
        <button class="act-seek-back seek-major">5秒戻る</button>
        <button class="act-slow-check primary grow2">スロー確認</button>
        <button class="act-seek-fwd seek-minor">5秒進む</button>
      </div>
      <div class="row">
        <button class="act-play-pause wide">一時停止</button>
        <button class="act-go-live secondary-action wide">現在へ</button>
      </div>
    </div>
  </div>

  <footer>
    <div class="row">
      <button class="act-seek-back seek-major">5秒戻る</button>
      <button class="act-slow-check primary grow2">スロー確認</button>
      <button class="act-seek-fwd seek-minor">5秒進む</button>
    </div>
    <div class="row">
      <button class="act-play-pause wide">一時停止</button>
      <button class="act-go-live secondary-action wide">現在へ</button>
    </div>

    <div id="secondaryControls">
      <div class="label">遅延時間</div>
      <div class="row" id="delayPresets"></div>

      <div class="row">
        <button id="minusOne" class="adjust">−1秒</button>
        <button id="plusOne" class="adjust">＋1秒</button>
        <button id="flipCamera" class="wide">カメラ切替</button>
      </div>
      <div class="row">
        <button id="mirrorToggle" class="wide">左右反転</button>
        <button id="rotateView" class="wide">映像回転</button>
      </div>
      <p class="hint-note">「現在へ」は設定した遅延時間を維持したまま、通常の遅延再生位置に戻ります（リアルタイム映像ではありません）。</p>
      <p id="privacyNote">映像は端末内でのみ処理され、外部には送信・保存されません。</p>
    </div>
  </footer>
</div>

<video id="sourceVideo" autoplay muted playsinline style="display:none"></video>

<script src="bufferEngine.js"></script>
<script src="playbackEngine.js"></script>
<script>
(() => {
  "use strict";

  // ---- 設定 ----
  const PRESETS = [1, 2, 3, 5, 7, 10, 15, 20, 25, 30];
  const DEFAULT_DELAY = 10;
  const MAX_DELAY_SEC = 30;
  const BUFFER_SCALE_WIDTH = 640;
  const CAPTURE_INTERVAL_MS = 1000 / 24;
  const FPS_WINDOW_MS = 2000; // 実効fps算出のための移動窓
  const SLOW_WINDOW_SEC = 5;
  const SLOW_RATE = 1 / 3;
  const SEEK_STEP_SEC = 5;
  // バッファ保持時間：最大遅延(30秒) + 「最大遅延位置からさらに5秒戻る/スロー確認する」ケースに
  // 対応できるだけの余裕を持たせる
  const BUFFER_RETENTION_SEC = MAX_DELAY_SEC + SLOW_WINDOW_SEC + 5;

  // ---- 状態 ----
  let delaySeconds = Number(localStorage.getItem("delaySeconds")) || DEFAULT_DELAY;
  let mirrored = localStorage.getItem("mirrored") === "1";
  let facingMode = localStorage.getItem("facingMode") || "environment";
  let stream = null;
  let running = false;
  let lastCaptureTime = 0;
  let cameraGeneration = 0;       // カメラ切替のたびに増分
  let pendingBitmapCount = 0;     // createImageBitmap待ち件数
  let debugMode = false;

  // 実効fps測定用（直近の確定(=バッファ追加済み)フレーム時刻の履歴）
  const captureTimestamps = [];

  // リングバッファ: time昇順を常に維持する {time, bitmap}
  const frameBuffer = [];

  // 遅延精度計測用
  let lastDisplayedFrameTime = null;
  let lastDisplayedTargetTime = null;

  // ---- Playback Engine ----
  // Buffer Engine(frameBuffer配列)には一切アクセスさせない。
  // 渡すのは nowMs と「バッファ最古フレームの時刻」という数値だけ。
  const playback = new PlaybackEngine.PlaybackEngine({ delaySeconds });

  // ---- DOM ----
  const sourceVideo = document.getElementById("sourceVideo");
  const displayCanvas = document.getElementById("displayCanvas");
  const displayCtx = displayCanvas.getContext("2d", { alpha: false });
  const stageMessage = document.getElementById("stageMessage");
  const stageMessageText = document.getElementById("stageMessageText");
  const diagLine = document.getElementById("diagLine");
  const delayBadge = document.getElementById("delayBadge");
  const delayValueLabel = document.getElementById("delayValueLabel");
  const slowIndicator = document.getElementById("slowIndicator");
  const statusEl = document.getElementById("status");
  const presetsRow = document.getElementById("delayPresets");
  const flipBtn = document.getElementById("flipCamera");
  const mirrorBtn = document.getElementById("mirrorToggle");
  const debugToggleBtn = document.getElementById("debugToggle");
  const debugPanel = document.getElementById("debugPanel");
  const fullscreenToggleBtn = document.getElementById("fullscreenToggle");
  const orientationHint = document.getElementById("orientationHint");
  const rotateViewBtn = document.getElementById("rotateView");
  const appEl = document.getElementById("app");
  const stageEl = document.getElementById("stage");
  const fsExitBtn = document.getElementById("fsExit");
  const settingsToggleBtn = document.getElementById("settingsToggle");
  const secondaryControls = document.getElementById("secondaryControls");
  // 通常フッターと全画面オーバーレイの両方に同じ操作ボタンが存在するため、
  // idではなくクラスで一括取得し、両方に同じ挙動・同じ表示更新を適用する。
  const seekBackBtns = document.querySelectorAll(".act-seek-back");
  const seekForwardBtns = document.querySelectorAll(".act-seek-fwd");
  const playPauseBtns = document.querySelectorAll(".act-play-pause");
  const slowCheckBtns = document.querySelectorAll(".act-slow-check");
  const goLiveBtns = document.querySelectorAll(".act-go-live");

  const bufferCanvas = document.createElement("canvas");
  const bufferCtx = bufferCanvas.getContext("2d", { alpha: false });

  function setStatus(text, live) {
    statusEl.textContent = text;
    statusEl.classList.toggle("live", !!live);
  }
  function setMessage(text) {
    stageMessageText.textContent = text;
    stageMessage.style.display = text ? "flex" : "none";
  }

  // ---- 起動時の環境診断 ----
  // getUserMedia()は失敗時に必ず例外を投げるとは限らず、環境によっては
  // 「許可ダイアログ自体が出ないまま無言で止まる」ことがある(特にfile://で開いた場合)。
  // そのため、まず静的にわかる情報を表示しておく。
  function buildDiagText() {
    const secure = window.isSecureContext;
    const hasMediaDevices = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
    const isTopFrame = window.self === window.top;
    const lines = [
      "protocol: " + location.protocol,
      "secureContext: " + secure,
      "mediaDevices対応: " + hasMediaDevices,
      "トップフレームで実行: " + isTopFrame,
    ];
    let warning = "";
    if (location.protocol === "file:") {
      warning =
        "\n⚠ file:// で開いています。カメラ利用にはHTTPS(またはlocalhost)配信が必要です。\n" +
        "許可ダイアログが表示されないまま、この画面から進まなくなっている可能性が高いです。";
    } else if (!secure) {
      warning = "\n⚠ セキュアコンテキストではありません。HTTPS配信に切り替えてください。";
    } else if (!isTopFrame) {
      warning = "\n⚠ iframe内で開かれています。埋め込み元がカメラ権限を許可していない可能性があります。";
    }
    return lines.join(" / ") + warning;
  }
  function showDiag(extra) {
    let text = buildDiagText();
    if (extra) text += "\n" + extra;
    diagLine.innerHTML = text.replace(/⚠.*$/gms, (m) => '<span class="bad">' + m + "</span>");
  }

  // ---- 遅延プリセットUI ----
  function renderPresets() {
    presetsRow.innerHTML = "";
    PRESETS.forEach((sec) => {
      const b = document.createElement("button");
      b.textContent = sec + "秒";
      b.className = sec === delaySeconds ? "selected" : "";
      b.addEventListener("click", () => setDelay(sec));
      presetsRow.appendChild(b);
    });
  }
  function setDelay(sec) {
    delaySeconds = Math.min(MAX_DELAY_SEC, Math.max(1, sec));
    localStorage.setItem("delaySeconds", String(delaySeconds));
    delayValueLabel.textContent = delaySeconds;
    playback.setDelaySeconds(delaySeconds);
    renderPresets();
  }
  document.getElementById("minusOne").addEventListener("click", () => setDelay(delaySeconds - 1));
  document.getElementById("plusOne").addEventListener("click", () => setDelay(delaySeconds + 1));

  mirrorBtn.addEventListener("click", () => {
    mirrored = !mirrored;
    localStorage.setItem("mirrored", mirrored ? "1" : "0");
    mirrorBtn.classList.toggle("selected", mirrored);
  });
  mirrorBtn.classList.toggle("selected", mirrored);

  debugToggleBtn.addEventListener("click", () => {
    debugMode = !debugMode;
    debugToggleBtn.classList.toggle("on", debugMode);
    debugPanel.style.display = debugMode ? "block" : "none";
  });

  // ---- 全画面表示 ----
  // #stage自体をFullscreen対象にすることで、header/footerはそのままDOM外(=非表示)として扱われ、
  // 映像がビューポート全体を占める。操作は#stage内の#fsControlsオーバーレイで行う。
  function updateFullscreenButton() {
    const isFs = !!document.fullscreenElement;
    fullscreenToggleBtn.textContent = isFs ? "全画面終了" : "全画面";
    fullscreenToggleBtn.classList.toggle("on", isFs);
  }
  function toggleFullscreen() {
    if (document.fullscreenElement) {
      document.exitFullscreen().catch(() => {});
    } else {
      stageEl.requestFullscreen().catch(() => {
        // 一部環境ではユーザー操作起点でも拒否されることがある。UIは変更せず静かに諦める。
      });
    }
  }
  if (!document.fullscreenEnabled) {
    fullscreenToggleBtn.disabled = true;
    fullscreenToggleBtn.textContent = "全画面非対応";
  } else {
    fullscreenToggleBtn.addEventListener("click", toggleFullscreen);
    fsExitBtn.addEventListener("click", toggleFullscreen);
    document.addEventListener("fullscreenchange", updateFullscreenButton);
  }

  // ---- 設定パネル(遅延時間・カメラ切替等)の開閉 ----
  settingsToggleBtn.addEventListener("click", () => {
    const open = secondaryControls.classList.toggle("open");
    settingsToggleBtn.classList.toggle("on", open);
  });

  // ---- 一定時間操作がなければUIを薄くする(操作UIをタップすると再表示) ----
  // 「薄い状態での最初のタップ」は再表示だけを行い、そのタップでボタンの動作までは
  // 実行させない(誤操作防止)。2回目以降のタップは通常どおり動作する。
  const UI_IDLE_MS = 4000;
  let idleTimer = null;
  let suppressNextClick = false;
  function resetIdleTimer() {
    appEl.classList.remove("ui-dim");
    if (idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      appEl.classList.add("ui-dim");
    }, UI_IDLE_MS);
  }
  function handlePointerDownForIdle() {
    if (appEl.classList.contains("ui-dim")) {
      suppressNextClick = true; // このあとに来るclickは再表示専用として無効化する
    }
    resetIdleTimer();
  }
  function handleClickForIdle(e) {
    if (suppressNextClick) {
      suppressNextClick = false;
      e.preventDefault();
      e.stopPropagation(); // ボタン自身のclickハンドラに到達させない
    }
  }
  // キャプチャフェーズで登録することで、ボタン自身のclickハンドラより先に実行させる
  [document.querySelector("header"), document.querySelector("footer"), stageEl].forEach((el) => {
    el.addEventListener("pointerdown", handlePointerDownForIdle, true);
    el.addEventListener("click", handleClickForIdle, true);
  });
  resetIdleTimer();

  flipBtn.addEventListener("click", async () => {
    facingMode = facingMode === "environment" ? "user" : "environment";
    localStorage.setItem("facingMode", facingMode);
    await startCamera();
  });

  // ---- 再生コントロール（Playback Engineの状態を操作するだけ。frameBufferには触れない）----
  // 通常フッターと全画面オーバーレイの両方のボタンに同じ挙動を割り当てる。
  seekBackBtns.forEach((btn) => btn.addEventListener("click", () => playback.seekBy(-SEEK_STEP_SEC)));
  seekForwardBtns.forEach((btn) => btn.addEventListener("click", () => playback.seekBy(SEEK_STEP_SEC)));
  goLiveBtns.forEach((btn) => btn.addEventListener("click", () => playback.goLive()));
  slowCheckBtns.forEach((btn) =>
    btn.addEventListener("click", () => playback.playRecentWindow(SLOW_WINDOW_SEC, SLOW_RATE))
  );
  playPauseBtns.forEach((btn) =>
    btn.addEventListener("click", () => {
      const label = playback.getStateLabel();
      if (label === "PAUSE" || label === "SLOW_PAUSED") {
        playback.resume();
      } else {
        playback.pause();
      }
    })
  );

  // ---- バッファ全クリア（カメラ切替・再起動時）----
  function clearBuffer() {
    for (const f of frameBuffer) {
      try { f.bitmap.close(); } catch (e) {}
    }
    frameBuffer.length = 0;
    captureTimestamps.length = 0;
  }

  // ---- カメラ起動 ----
  async function startCamera() {
    setMessage("カメラへのアクセスを準備しています…");
    setStatus("接続中…", false);
    showDiag();
    running = false;

    cameraGeneration += 1; // このタイミング以降に確定するBitmapのみ有効
    const myGeneration = cameraGeneration;

    if (stream) {
      stream.getTracks().forEach((t) => t.stop());
      stream = null;
    }
    clearBuffer();
    playback.goLive(); // バッファが入れ替わるため、再生位置の手動操作状態を持ち越さない

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setMessage("このブラウザはカメラ機能に対応していません。");
      showDiag();
      setStatus("非対応", false);
      return;
    }

    // getUserMedia()は、許可ダイアログ自体が表示されない環境(file://での実行など)では
    // 成功も失敗もせず無言で止まることがある。一定時間応答がなければヒントを追加表示する。
    const watchdog = setTimeout(() => {
      showDiag(
        "⚠ " + 8 + "秒経っても応答がありません。許可ダイアログが表示されていないか確認してください。"
      );
    }, 8000);

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: facingMode },
          width: { ideal: 1280 },
          height: { ideal: 720 },
          frameRate: { ideal: 30 },
        },
      });
    } catch (err) {
      clearTimeout(watchdog);
      console.error(err);
      if (err && err.name === "NotAllowedError") {
        setMessage("カメラの利用が許可されていません。ブラウザの設定でカメラへのアクセスを許可してください。");
      } else if (err && err.name === "NotFoundError") {
        setMessage("利用できるカメラが見つかりませんでした。");
      } else {
        setMessage("カメラを起動できませんでした（" + (err && err.message ? err.message : "不明なエラー") + "）。");
      }
      showDiag();
      setStatus("エラー", false);
      return;
    }
    clearTimeout(watchdog);

    if (myGeneration !== cameraGeneration) {
      // 切替がさらに発生していた場合はこのstreamは破棄
      stream.getTracks().forEach((t) => t.stop());
      return;
    }

    sourceVideo.srcObject = stream;
    await sourceVideo.play().catch(() => {});

    applyOrientation();

    setMessage("");
    setStatus("LIVE（遅延中）", true);
    running = true;
  }

  // ---- 映像の向き補正 ----
  // iOS Safariでは、<video>要素は自動的に正しい向きで表示されるが、
  // CanvasへdrawImage()した場合はカメラセンサーの素の向き(多くは縦長)のまま
  // 描画されてしまうことがある。
  //
  // 「映像が横長か縦長か」と「画面が横長か縦長か」を比較するだけの判定では、
  // 横長と横長(向かい合う2方向)や縦長と縦長(向かい合う2方向)を区別できず、
  // デバイスを180°回転(左右持ち替え)した際に向きがズレたまま検知できない、
  // という不具合があった。そのため、screen.orientation.angle（0/90/180/270°の
  // 実際の画面角度）を直接使う方式に変更する。
  //
  // sensorOffsetDeg は「画面角度が0°のときに映像を正しい向きにするための
  // 固定の補正値」であり、端末・カメラの個体差を表す。これはユーザーが
  // 「映像回転」ボタンで一度調整すれば、以後はどの向きに回転させても
  // (screen.orientation.angleを毎回足し引きするだけなので)正しく追従する。
  let currentRotation = 0; // 実際に適用中の回転角(0/90/180/270)
  let sensorOffsetDeg = Number(localStorage.getItem("sensorOffsetDeg")) || 0;

  function getScreenAngle() {
    if (screen.orientation && typeof screen.orientation.angle === "number") {
      return screen.orientation.angle;
    }
    if (typeof window.orientation === "number") {
      return ((window.orientation % 360) + 360) % 360;
    }
    return 0;
  }

  function computeRotation() {
    return ((sensorOffsetDeg + getScreenAngle()) % 360 + 360) % 360;
  }

  function applyOrientation() {
    if (!stream) return;
    const track = stream.getVideoTracks()[0];
    if (!track) return;
    const settings = track.getSettings ? track.getSettings() : {};
    const srcW = settings.width || sourceVideo.videoWidth || 1280;
    const srcH = settings.height || sourceVideo.videoHeight || 720;

    const rotation = computeRotation();
    const swapped = rotation === 90 || rotation === 270;
    const outW = swapped ? srcH : srcW;
    const outH = swapped ? srcW : srcH;

    const sizeChanged = outW !== displayCanvas.width || outH !== displayCanvas.height;
    if (rotation !== currentRotation || sizeChanged) {
      currentRotation = rotation;
      const scale = BUFFER_SCALE_WIDTH / outW;
      bufferCanvas.width = Math.round(outW * scale);
      bufferCanvas.height = Math.round(outH * scale);
      displayCanvas.width = outW;
      displayCanvas.height = outH;
      // 向き・サイズが変わると既存バッファの内容と整合しなくなるため破棄する
      clearBuffer();
      playback.goLive();
    }
  }

  // videoソースをrotationDeg分回転させてctx(出力サイズoutW×outH)へ描画する
  function drawRotatedFrame(ctx, source, rotationDeg, outW, outH) {
    ctx.save();
    switch (rotationDeg) {
      case 90:
        ctx.translate(outW, 0);
        ctx.rotate(Math.PI / 2);
        ctx.drawImage(source, 0, 0, outH, outW);
        break;
      case 180:
        ctx.translate(outW, outH);
        ctx.rotate(Math.PI);
        ctx.drawImage(source, 0, 0, outW, outH);
        break;
      case 270:
        ctx.translate(0, outH);
        ctx.rotate(-Math.PI / 2);
        ctx.drawImage(source, 0, 0, outH, outW);
        break;
      default:
        ctx.drawImage(source, 0, 0, outW, outH);
    }
    ctx.restore();
  }

  rotateViewBtn.addEventListener("click", () => {
    // sensorOffsetDegは画面角度に依存しない固定値として保存するため、
    // ここで一度直せば、以後どの向きに回転させても正しく追従する。
    sensorOffsetDeg = (sensorOffsetDeg + 90) % 360;
    localStorage.setItem("sensorOffsetDeg", String(sensorOffsetDeg));
    applyOrientation();
  });

  // デバイスの向きが変わったら再計算する
  window.addEventListener("resize", () => applyOrientation());
  window.addEventListener("orientationchange", () => applyOrientation());
  if (screen.orientation && screen.orientation.addEventListener) {
    screen.orientation.addEventListener("change", () => applyOrientation());
  }

  // ---- 横向き案内 ----
  function updateOrientationHint() {
    const isPortrait = window.innerHeight > window.innerWidth;
    orientationHint.classList.toggle("show", isPortrait);
  }
  window.addEventListener("resize", updateOrientationHint);
  window.addEventListener("orientationchange", updateOrientationHint);
  updateOrientationHint();

  // ---- time昇順を保った挿入・時刻検索は bufferEngine.js の共通実装を利用 ----
  // (ブラウザ実装とテストコードでロジックが乖離しないようにするため)
  const insertSorted = (frame) => BufferEngine.insertSorted(frameBuffer, frame);

  // ---- フレーム取り込み ----
  function captureFrame(now) {
    if (now - lastCaptureTime < CAPTURE_INTERVAL_MS) return;
    if (sourceVideo.readyState < 2) return;
    lastCaptureTime = now;

    const myGeneration = cameraGeneration;
    drawRotatedFrame(bufferCtx, sourceVideo, currentRotation, bufferCanvas.width, bufferCanvas.height);

    pendingBitmapCount++;
    createImageBitmap(bufferCanvas)
      .then((bmp) => {
        pendingBitmapCount--;
        // カメラが切り替わった後に完了したBitmapは破棄する（混入防止）
        if (myGeneration !== cameraGeneration) {
          bmp.close();
          return;
        }
        insertSorted({ time: now, bitmap: bmp });
        captureTimestamps.push(now);

        // 統計用の古い履歴を間引く
        const fpsCutoff = now - FPS_WINDOW_MS;
        while (captureTimestamps.length && captureTimestamps[0] < fpsCutoff) {
          captureTimestamps.shift();
        }

        // 古いフレームの破棄（設定した保持時間を超えたら破棄）
        const cutoff = now - BUFFER_RETENTION_SEC * 1000;
        while (frameBuffer.length && frameBuffer[0].time < cutoff) {
          const old = frameBuffer.shift();
          old.bitmap.close();
        }
      })
      .catch(() => {
        pendingBitmapCount--;
      });
  }

  // ---- 時刻検索は bufferEngine.js の共通実装(二分探索)を利用 ----
  const findFrameAt = (targetTime) => BufferEngine.findFrameAt(frameBuffer, targetTime);

  // ---- 表示 ----
  // 「どのtimestampを表示するか」はPlayback Engineが決定し、
  // 実際のフレーム取得はBuffer EngineのfindFrameAtに委ねる。
  // Playback Engineはframe配列を直接加工しない(疎結合)。
  function renderFrame(now) {
    if (!running) return;

    const oldestAvailableTime = frameBuffer.length ? frameBuffer[0].time : now;
    const targetTime = playback.update(now, oldestAvailableTime);
    const frame = findFrameAt(targetTime);

    if (frame) {
      displayCtx.save();
      if (mirrored) {
        displayCtx.translate(displayCanvas.width, 0);
        displayCtx.scale(-1, 1);
      }
      displayCtx.drawImage(frame.bitmap, 0, 0, displayCanvas.width, displayCanvas.height);
      displayCtx.restore();
      delayBadge.style.display = "block";
      lastDisplayedFrameTime = frame.time;
      lastDisplayedTargetTime = targetTime;
    } else {
      delayBadge.style.display = "none";
    }

    updatePlaybackUI();
  }

  const STATE_LABEL_JA = {
    DELAY: "遅延中",
    PAUSE: "一時停止",
    REPLAY: "再生中（過去）",
    SLOW: "スロー再生 1/3x",
    SLOW_PAUSED: "スロー再生（一時停止）",
  };

  function updatePlaybackUI() {
    const label = playback.getStateLabel();
    setStatus(STATE_LABEL_JA[label] || label, label === "DELAY");
    slowIndicator.style.display = label === "SLOW" || label === "SLOW_PAUSED" ? "block" : "none";
    const playPauseText = label === "PAUSE" || label === "SLOW_PAUSED" ? "再生" : "一時停止";
    playPauseBtns.forEach((btn) => (btn.textContent = playPauseText));
    goLiveBtns.forEach((btn) => (btn.disabled = label === "DELAY"));
    // スロー確認中は、映像確認に集中できるよう補助コントロールを自動的に隠す
    appEl.classList.toggle("focus-mode", label === "SLOW" || label === "SLOW_PAUSED");
  }

  // ---- デバッグ表示 ----
  let lastDebugUpdate = 0;
  function updateDebugPanel(now) {
    if (!debugMode) return;
    if (now - lastDebugUpdate < 250) return; // 更新頻度を抑える
    lastDebugUpdate = now;

    const effFps = captureTimestamps.length > 1
      ? ((captureTimestamps.length - 1) / ((captureTimestamps[captureTimestamps.length - 1] - captureTimestamps[0]) / 1000)).toFixed(1)
      : "-";

    const bufDurationSec = frameBuffer.length
      ? ((frameBuffer[frameBuffer.length - 1].time - frameBuffer[0].time) / 1000).toFixed(2)
      : "0";

    const camRes = sourceVideo.videoWidth ? (sourceVideo.videoWidth + "x" + sourceVideo.videoHeight) : "-";
    const bufRes = bufferCanvas.width ? (bufferCanvas.width + "x" + bufferCanvas.height) : "-";

    let memText = "取得不可";
    if (performance.memory) {
      memText = (performance.memory.usedJSHeapSize / 1048576).toFixed(1) + " MB";
    }

    let delayDiffText = "-";
    if (lastDisplayedFrameTime !== null) {
      const actualDelayMs = now - lastDisplayedFrameTime;
      const diffMs = actualDelayMs - delaySeconds * 1000;
      delayDiffText = (diffMs >= 0 ? "+" : "") + diffMs.toFixed(0) + " ms";
    }

    const pendingWarn = pendingBitmapCount > 10 ? ' class="warn"' : "";

    debugPanel.innerHTML =
      row("カメラ解像度", camRes) +
      row("バッファ解像度", bufRes) +
      row("バッファ枚数", frameBuffer.length + " 枚") +
      row("バッファ長", bufDurationSec + " 秒") +
      row("実効fps", effFps) +
      row("設定遅延", delaySeconds + " 秒") +
      row("再生状態", playback.getStateLabel()) +
      row("実遅延との差", delayDiffText) +
      `<div class="row"><span>Bitmap待ち</span><span${pendingWarn}>${pendingBitmapCount}</span></div>` +
      row("JSヒープ", memText);
  }
  function row(label, value) {
    return `<div class="row"><span>${label}</span><span>${value}</span></div>`;
  }

  function loop() {
    const now = performance.now();
    if (running) {
      captureFrame(now);
      renderFrame(now);
    }
    updateDebugPanel(now);
    requestAnimationFrame(loop);
  }

  // ---- 初期化 ----
  delayValueLabel.textContent = delaySeconds;
  renderPresets();
  startCamera();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
